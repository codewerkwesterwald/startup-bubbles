<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, setDoc, deleteField
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBKHgOhpR0DkElyWsNxuK0vG-k9oAzLLPY",
    authDomain: "startup-bubbles.firebaseapp.com",
    projectId: "startup-bubbles",
    storageBucket: "startup-bubbles.firebasestorage.app",
    messagingSenderId: "415245240164",
    appId: "1:415245240164:web:da6aa97bbed3b6e41cdc71",
  };

  const firebaseApp = initializeApp(firebaseConfig);
  const auth = getAuth(firebaseApp);
  const db = getFirestore(firebaseApp);
  const provider = new GoogleAuthProvider();

  let currentUser = null;
  let appMounted = false;

  function sanitizeKey(key) {
    return key.replace(/[^A-Za-z0-9_]/g, "_");
  }

  // Ersetzt die Claude-Artifact-Speicher-API durch eine Firestore-Variante,
  // gebunden an das angemeldete Google-Konto — Daten sind geräteübergreifend verfügbar.
  window.storage = {
    async get(key) {
      if (!currentUser) return null;
      try {
        const snap = await getDoc(doc(db, "appData", currentUser.uid));
        if (!snap.exists()) return null;
        const data = snap.data();
        const fieldKey = sanitizeKey(key);
        if (!(fieldKey in data)) return null;
        return { key, value: data[fieldKey], shared: false };
      } catch (e) {
        console.error("storage.get error", e);
        return null;
      }
    },
    async set(key, value) {
      if (!currentUser) return null;
      try {
        const fieldKey = sanitizeKey(key);
        await setDoc(doc(db, "appData", currentUser.uid), { [fieldKey]: value }, { merge: true });
        return { key, value, shared: false };
      } catch (e) {
        console.error("storage.set error", e);
        return null;
      }
    },
    async delete(key) {
      if (!currentUser) return null;
      try {
        const fieldKey = sanitizeKey(key);
        await setDoc(doc(db, "appData", currentUser.uid), { [fieldKey]: deleteField() }, { merge: true });
        return { key, deleted: true, shared: false };
      } catch (e) {
        console.error("storage.delete error", e);
        return null;
      }
    },
    async list(prefix) {
      if (!currentUser) return null;
      try {
        const snap = await getDoc(doc(db, "appData", currentUser.uid));
        if (!snap.exists()) return { keys: [] };
        const p = prefix ? sanitizeKey(prefix) : null;
        const keys = Object.keys(snap.data()).filter((k) => !p || k.startsWith(p));
        return { keys, prefix, shared: false };
      } catch (e) {
        console.error("storage.list error", e);
        return null;
      }
    },
  };

  function tryMount() {
    if (!currentUser || appMounted || typeof window.__mountBubblesApp !== "function") return;
    window.__mountBubblesApp({
      email: currentUser.email,
      onSignOut: () => signOut(auth),
    });
    appMounted = true;
  }

  window.addEventListener("bubbles-ready", tryMount);

  const signInBtn = document.getElementById("google-signin-btn");
  const signInBtnSecondary = document.getElementById("google-signin-btn-secondary");
  const loginGate = document.getElementById("login-gate");
  const rootEl = document.getElementById("root");
  const loginError = document.getElementById("login-error");

  async function handleSignIn() {
    loginError.textContent = "";
    signInBtn.disabled = true;
    try {
      await signInWithPopup(auth, provider);
    } catch (e) {
      loginError.textContent = "Anmeldung fehlgeschlagen. Bitte erneut versuchen.";
      console.error(e);
    } finally {
      signInBtn.disabled = false;
    }
  }

  signInBtn.addEventListener("click", handleSignIn);
  signInBtnSecondary.addEventListener("click", handleSignIn);

  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    if (user) {
      loginGate.style.display = "none";
      rootEl.style.display = "block";
      // window.__bubblesReady wird true, sobald das Babel-Skript unten fertig geladen ist
      if (window.__bubblesReady) {
        tryMount();
      }
    } else {
      loginGate.style.display = "flex";
      rootEl.style.display = "none";
      appMounted = false;
      rootEl.innerHTML = "";
    }
  });
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const STATUS = {
  idee: { label: "Idee", color: "#9B8AE0", icon: "💡", text: "#fff" },
  warten: { label: "Warten", color: "#9B9BAE", icon: "⏸️", text: "#fff" },
  pruefung: { label: "In Prüfung", color: "#FFC93C", icon: "🔍", text: "#211D33" },
  validiert: { label: "Validiert", color: "#06D6A0", icon: "✅", text: "#0B3B30" },
  umsetzung: { label: "In Umsetzung", color: "#3A86FF", icon: "🛠️", text: "#fff" },
  live: { label: "Live", color: "#3DDC84", icon: "🚀", text: "#0B3B22" },
  verworfen: { label: "Verworfen", color: "#FF5D8F", icon: "🗑️", text: "#fff" },
};

function hexToRgb(hex) {
  const h = hex.replace("#", "");
  const full = h.length === 3 ? h.split("").map((c) => c + c).join("") : h;
  const num = parseInt(full, 16);
  return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
}

// percent > 0 hellt Richtung Weiß auf, percent < 0 dunkelt Richtung Schwarz ab
function shade(hex, percent) {
  const { r, g, b } = hexToRgb(hex);
  const target = percent < 0 ? 0 : 255;
  const p = Math.abs(percent);
  const mix = (c) => Math.round((target - c) * p + c);
  return `rgb(${mix(r)}, ${mix(g)}, ${mix(b)})`;
}

const STORAGE_KEY = "ideenwerkstatt:ideas";
const PROJECTS_STORAGE_KEY = "ideenwerkstatt:projects";
const GOALS_STORAGE_KEY = "ideenwerkstatt:goals";

const GOAL_QUESTIONS = [
  {
    key: "ideaType",
    question: "Welche Art von Geschäftsidee soll es sein?",
    type: "single",
    options: [
      { value: "side_hustle", label: "Side Hustle (nebenbei)" },
      { value: "hauptgewerbe", label: "Hauptgewerbe (Vollzeit)" },
    ],
  },
  {
    key: "monthlyIncome",
    question: "Welchen monatlichen Verdienst strebst du an?",
    type: "single",
    options: [
      { value: "<1000", label: "Unter 1.000 €" },
      { value: "1000-5000", label: "1.000 – 5.000 €" },
      { value: "5000-20000", label: "5.000 – 20.000 €" },
      { value: ">20000", label: "Über 20.000 €" },
    ],
  },
  {
    key: "industries",
    question: "In welchem Bereich soll die Idee sein?",
    type: "multi",
    options: [
      { value: "kfz", label: "KFZ" },
      { value: "immobilien", label: "Immobilien" },
      { value: "gastro", label: "Gastro" },
      { value: "technologie", label: "Technologie / Software" },
      { value: "gesundheit", label: "Gesundheit" },
      { value: "bildung", label: "Bildung" },
      { value: "ecommerce", label: "E-Commerce" },
      { value: "sonstiges", label: "Sonstiges" },
    ],
  },
  {
    key: "timeframe",
    question: "In welchem Zeitrahmen soll die Idee stehen?",
    type: "single",
    options: [
      { value: "<6m", label: "Unter 6 Monaten" },
      { value: "6-12m", label: "6 – 12 Monate" },
      { value: ">1y", label: "Über 1 Jahr" },
    ],
  },
];

function emptyGoals() {
  return { ideaType: "", monthlyIncome: "", industries: [], timeframe: "", onboarded: false };
}
const TOP_SCORER_PROJECT_MS = 28 * 24 * 60 * 60 * 1000; // 4 Wochen durchgehend Topscorer

const WEEK_MS = 7 * 24 * 60 * 60 * 1000;

function lastActivityTime(idea) {
  const timestamps = (idea.milestones || [])
    .map((m) => new Date(`${m.date}T00:00:00`).getTime())
    .filter((t) => !isNaN(t));
  return timestamps.length ? Math.max(...timestamps) : idea.createdAt;
}

function recentMilestoneCount(idea) {
  const cutoff = Date.now() - WEEK_MS;
  return (idea.milestones || []).filter((m) => {
    const t = new Date(`${m.date}T00:00:00`).getTime();
    return !isNaN(t) && t >= cutoff;
  }).length;
}

function momentumBonus(idea) {
  return Math.min(recentMilestoneCount(idea) * 0.5, 2);
}

// Gegenstück zur Flamme: Sobald seit über einer Woche kein Meilenstein mehr kam
// (die Flamme also erloschen ist) und eine weitere Woche vergeht, entsteht ein
// Eisblock. Pro zusätzlicher Woche ohne Aktivität kommt ein weiterer dazu.
function iceBlockCount(idea) {
  if (idea.status === "warten") return 0;
  const elapsed = Date.now() - lastActivityTime(idea);
  if (elapsed <= WEEK_MS) return 0;
  const extraWeeks = Math.floor((elapsed - WEEK_MS) / WEEK_MS);
  return Math.max(0, Math.min(extraWeeks, 6));
}

function icePenalty(idea) {
  return iceBlockCount(idea) * 0.5;
}

function computeScore(idea) {
  const ease = 11 - idea.effort;
  const base = (idea.impact * 2 + idea.confidence + ease) / 4;
  return base + momentumBonus(idea) - icePenalty(idea);
}

function scoreTier(score) {
  if (score >= 7.5) return "#06D6A0";
  if (score >= 5) return "#FFC93C";
  return "#FF5D8F";
}

const STALE_MS = WEEK_MS;

function isStale(idea) {
  if (idea.status === "warten") return false;
  return Date.now() - lastActivityTime(idea) > STALE_MS;
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

const emptyDraft = () => ({
  title: "",
  description: "",
  impact: 5,
  effort: 5,
  confidence: 5,
  status: "idee",
  milestones: [],
});

function IdeenWerkstatt({ userEmail, onSignOut }) {
  const [ideas, setIdeas] = useState([]);
  const [projects, setProjects] = useState([]);
  const [goals, setGoals] = useState(null);
  const [goalsDraft, setGoalsDraft] = useState(emptyGoals());
  const [onboardStep, setOnboardStep] = useState(0);
  const [loaded, setLoaded] = useState(false);
  const [showForm, setShowForm] = useState(false);
  const [draft, setDraft] = useState(emptyDraft());
  const [editId, setEditId] = useState(null);
  const [editTarget, setEditTarget] = useState("idea");
  const [filter, setFilter] = useState(new Set());
  const [error, setError] = useState(null);
  const [viewMode, setViewMode] = useState("bubbles");
  const [modalEvalExpanded, setModalEvalExpanded] = useState(true);
  const [sortCol, setSortCol] = useState("score");
  const [sortDir, setSortDir] = useState("desc");
  const [milestoneText, setMilestoneText] = useState("");
  const [milestoneDate, setMilestoneDate] = useState("");
  const [stageSize, setStageSize] = useState({ width: 860, height: 520 });
  const [comingSoonMsg, setComingSoonMsg] = useState("");
  const [activeTab, setActiveTab] = useState("ideen");
  const titleRef = useRef(null);
  const stageRef = useRef(null);
  const nodeRefs = useRef({});
  const simRef = useRef({});
  const rafRef = useRef(null);
  const mouseRef = useRef({ x: 0, y: 0, active: false });
  const dragRef = useRef({ id: null, idea: null, startX: 0, startY: 0, moved: false });
  const comingSoonTimeoutRef = useRef(null);

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY, false);
        if (res && res.value) {
          setIdeas(JSON.parse(res.value));
        }
      } catch (e) {
        // key not present yet — that's fine, start empty
      }
      try {
        const resP = await window.storage.get(PROJECTS_STORAGE_KEY, false);
        if (resP && resP.value) {
          setProjects(JSON.parse(resP.value));
        }
      } catch (e) {
        // noch keine Projekte vorhanden
      }
      try {
        const resG = await window.storage.get(GOALS_STORAGE_KEY, false);
        if (resG && resG.value) {
          setGoals(JSON.parse(resG.value));
        }
      } catch (e) {
        // noch keine Ziele gesetzt — Onboarding wird gezeigt
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  async function persist(next) {
    setIdeas(next);
    try {
      const res = await window.storage.set(STORAGE_KEY, JSON.stringify(next), false);
      if (!res) setError("Speichern hat nicht geklappt. Änderung bleibt nur lokal.");
      else setError(null);
    } catch (e) {
      setError("Speichern hat nicht geklappt. Änderung bleibt nur lokal.");
    }
  }

  async function persistProjects(next) {
    setProjects(next);
    try {
      const res = await window.storage.set(PROJECTS_STORAGE_KEY, JSON.stringify(next), false);
      if (!res) setError("Speichern hat nicht geklappt. Änderung bleibt nur lokal.");
      else setError(null);
    } catch (e) {
      setError("Speichern hat nicht geklappt. Änderung bleibt nur lokal.");
    }
  }

  async function persistGoals(next) {
    setGoals(next);
    try {
      const res = await window.storage.set(GOALS_STORAGE_KEY, JSON.stringify(next), false);
      if (!res) setError("Speichern hat nicht geklappt. Änderung bleibt nur lokal.");
      else setError(null);
    } catch (e) {
      setError("Speichern hat nicht geklappt. Änderung bleibt nur lokal.");
    }
  }

  function toggleGoalMulti(key, value) {
    setGoalsDraft((prev) => {
      const current = prev[key] || [];
      const next = current.includes(value) ? current.filter((v) => v !== value) : [...current, value];
      return { ...prev, [key]: next };
    });
  }

  function selectGoalSingle(key, value) {
    setGoalsDraft((prev) => ({ ...prev, [key]: value }));
  }

  function goalOnboardNext() {
    if (onboardStep < GOAL_QUESTIONS.length - 1) {
      setOnboardStep((s) => s + 1);
    } else {
      persistGoals({ ...goalsDraft, onboarded: true });
      setOnboardStep(0);
    }
  }

  function goalOnboardSkip() {
    persistGoals({ ...emptyGoals(), onboarded: true });
    setOnboardStep(0);
  }

  function saveGoalsFromTab() {
    persistGoals({ ...goalsDraft, onboarded: true });
  }

  function removeProject(id) {
    persistProjects(projects.filter((p) => p.id !== id));
  }

  function demoteToIdea(id) {
    const project = projects.find((p) => p.id === id);
    if (!project) return;
    const { promotedAt, promotedScore, ...rest } = project;
    const restored = { ...rest, topScorerSince: null };
    persistProjects(projects.filter((p) => p.id !== id));
    persist([...ideas, restored]);
  }

  // Prüft bei jeder Datenänderung, wer aktuell Topscorer ist, merkt sich seit wann,
  // und befördert eine Idee automatisch zum Projekt, sobald sie 4 Wochen durchgehend
  // die höchste Bewertung aller Ideen hatte.
  useEffect(() => {
    if (!loaded || ideas.length === 0) return;

    let topIdea = null;
    let topScore = -Infinity;
    ideas.forEach((idea) => {
      const s = computeScore(idea);
      if (s > topScore) {
        topScore = s;
        topIdea = idea;
      }
    });
    if (!topIdea) return;

    const now = Date.now();
    let changed = false;
    const nextIdeas = ideas.map((idea) => {
      if (idea.id === topIdea.id) {
        if (!idea.topScorerSince) {
          changed = true;
          return { ...idea, topScorerSince: now };
        }
        return idea;
      }
      if (idea.topScorerSince) {
        changed = true;
        return { ...idea, topScorerSince: null };
      }
      return idea;
    });

    const currentTop = nextIdeas.find((i) => i.id === topIdea.id);
    if (currentTop.topScorerSince && now - currentTop.topScorerSince >= TOP_SCORER_PROJECT_MS) {
      const { topScorerSince, ...rest } = currentTop;
      const promoted = { ...rest, promotedAt: now, promotedScore: topScore };
      const remainingIdeas = nextIdeas.filter((i) => i.id !== topIdea.id);
      persist(remainingIdeas);
      persistProjects([...projects, promoted]);
      return;
    }

    if (changed) {
      persist(nextIdeas);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [ideas, loaded]);

  function openNewForm() {
    setDraft(emptyDraft());
    setEditId(null);
    setEditTarget("idea");
    setShowForm(true);
    setModalEvalExpanded(true);
    setMilestoneText("");
    setMilestoneDate(new Date().toISOString().slice(0, 10));
    setTimeout(() => titleRef.current && titleRef.current.focus(), 50);
  }

  function openEditForm(idea, collapseEval) {
    setDraft({ ...emptyDraft(), ...idea, milestones: idea.milestones || [] });
    setEditId(idea.id);
    setEditTarget("idea");
    setShowForm(true);
    setModalEvalExpanded(!collapseEval);
    setMilestoneText("");
    setMilestoneDate(new Date().toISOString().slice(0, 10));
  }

  function openProjectEdit(project) {
    setDraft({ ...emptyDraft(), ...project, milestones: project.milestones || [] });
    setEditId(project.id);
    setEditTarget("project");
    setShowForm(true);
    setModalEvalExpanded(true);
    setMilestoneText("");
    setMilestoneDate(new Date().toISOString().slice(0, 10));
  }

  function addMilestone() {
    if (!milestoneText.trim()) return;
    const m = { id: uid(), text: milestoneText.trim(), date: milestoneDate || new Date().toISOString().slice(0, 10) };
    setDraft((prev) => ({ ...prev, milestones: [...(prev.milestones || []), m] }));
    setMilestoneText("");
  }

  function removeMilestone(id) {
    setDraft((prev) => ({ ...prev, milestones: (prev.milestones || []).filter((m) => m.id !== id) }));
  }

  function formatMilestoneDate(dateStr) {
    if (!dateStr) return "";
    const d = new Date(`${dateStr}T00:00:00`);
    if (isNaN(d.getTime())) return dateStr;
    return d.toLocaleDateString("de-DE");
  }

  function saveDraft() {
    if (!draft.title.trim()) return;
    let finalDraft = draft;
    if (milestoneText.trim()) {
      const m = { id: uid(), text: milestoneText.trim(), date: milestoneDate || new Date().toISOString().slice(0, 10) };
      finalDraft = { ...draft, milestones: [...(draft.milestones || []), m] };
    }
    if (editTarget === "project" && editId) {
      const original = projects.find((p) => p.id === editId);
      const next = projects.map((p) => (p.id === editId ? {
        ...finalDraft,
        id: editId,
        createdAt: original ? original.createdAt : p.createdAt,
        promotedAt: original ? original.promotedAt : p.promotedAt,
        promotedScore: original ? original.promotedScore : p.promotedScore,
      } : p));
      persistProjects(next);
    } else if (editId) {
      const next = ideas.map((i) => (i.id === editId ? { ...finalDraft, id: editId, createdAt: i.createdAt } : i));
      persist(next);
    } else {
      const next = [...ideas, { ...finalDraft, id: uid(), createdAt: Date.now() }];
      persist(next);
    }
    setShowForm(false);
    setDraft(emptyDraft());
    setEditId(null);
    setEditTarget("idea");
    setMilestoneText("");
  }

  function demoteToIdeaFromModal() {
    if (!editId) return;
    let finalDraft = draft;
    if (milestoneText.trim()) {
      const m = { id: uid(), text: milestoneText.trim(), date: milestoneDate || new Date().toISOString().slice(0, 10) };
      finalDraft = { ...draft, milestones: [...(draft.milestones || []), m] };
    }
    const original = projects.find((p) => p.id === editId);
    const merged = { ...finalDraft, id: editId, createdAt: original ? original.createdAt : Date.now(), topScorerSince: null };
    delete merged.promotedAt;
    delete merged.promotedScore;
    persistProjects(projects.filter((p) => p.id !== editId));
    persist([...ideas, merged]);
    setShowForm(false);
    setDraft(emptyDraft());
    setEditId(null);
    setEditTarget("idea");
    setMilestoneText("");
  }

  function promoteToProjectManually() {
    if (!editId || editTarget !== "idea") return;
    let finalDraft = draft;
    if (milestoneText.trim()) {
      const m = { id: uid(), text: milestoneText.trim(), date: milestoneDate || new Date().toISOString().slice(0, 10) };
      finalDraft = { ...draft, milestones: [...(draft.milestones || []), m] };
    }
    const original = ideas.find((i) => i.id === editId);
    const merged = { ...finalDraft, id: editId, createdAt: original ? original.createdAt : Date.now() };
    delete merged.topScorerSince;
    const score = computeScore(merged);
    const promoted = { ...merged, promotedAt: Date.now(), promotedScore: score };
    persist(ideas.filter((i) => i.id !== editId));
    persistProjects([...projects, promoted]);
    setShowForm(false);
    setDraft(emptyDraft());
    setEditId(null);
    setEditTarget("idea");
    setMilestoneText("");
  }

  function removeIdea(id) {
    persist(ideas.filter((i) => i.id !== id));
  }

  function changeStatus(id, status) {
    persist(ideas.map((i) => (i.id === id ? { ...i, status } : i)));
  }

  function updateIdeaPosition(id, posX, posY) {
    persist(ideas.map((i) => (i.id === id ? { ...i, posX, posY } : i)));
  }

  function toggleFilter(key) {
    setFilter((prev) => {
      if (key === "alle") return new Set();
      const next = new Set(prev);
      if (next.has(key)) next.delete(key);
      else next.add(key);
      return next;
    });
  }

  function showComingSoon(label) {
    setComingSoonMsg(`${label} kommt bald 👀`);
    clearTimeout(comingSoonTimeoutRef.current);
    comingSoonTimeoutRef.current = setTimeout(() => setComingSoonMsg(""), 2000);
  }

  const filtered = ideas.filter((i) => filter.size === 0 || filter.has(i.status));
  function tableSortValue(idea, col) {
    if (col === "score") return computeScore(idea);
    if (col === "title") return idea.title.toLowerCase();
    if (col === "status") return STATUS[idea.status].label;
    if (col === "createdAt") return idea.createdAt;
    return idea[col];
  }

  function toggleSortCol(col) {
    if (sortCol === col) {
      setSortDir(sortDir === "asc" ? "desc" : "asc");
    } else {
      setSortCol(col);
      setSortDir(col === "title" || col === "status" ? "asc" : "desc");
    }
  }

  const tableSorted = [...filtered].sort((a, b) => {
    const va = tableSortValue(a, sortCol);
    const vb = tableSortValue(b, sortCol);
    let cmp;
    if (typeof va === "string") cmp = va.localeCompare(vb);
    else cmp = va - vb;
    return sortDir === "asc" ? cmp : -cmp;
  });

  // Größe relativ zur aktuellen Score-Spanne berechnen, nicht am starren 0–10-Raster,
  // damit Unterschiede zwischen den Ideen (v. a. Rang 1 vs. 2 vs. 3 ...) deutlich sichtbar sind.
  const filteredScores = filtered.map((i) => computeScore(i));
  const scoreMax = filteredScores.length ? Math.max(...filteredScores) : 10;
  const scoreMin = filteredScores.length ? Math.min(...filteredScores) : 0;
  const scoreSpan = scoreMax - scoreMin;

  function scoreToT(score) {
    if (scoreSpan < 0.05) return 0.55; // alle Ideen etwa gleich stark bewertet
    return (score - scoreMin) / scoreSpan;
  }

  // Flächenbasierter Größenalgorithmus: verteilt einen festen Anteil der verfügbaren
  // Stage-Fläche auf alle Bubbles, sodass sie bei jeder Fenstergröße und Anzahl
  // rechnerisch hineinpassen, statt mit festen Pixelwerten zu überlappen.
  function computeBubbleSizes(ideasList, bounds) {
    const sizeMap = {};
    const n = ideasList.length;
    if (n === 0) return sizeMap;

    const w = Math.max(bounds.width, 1);
    const h = Math.max(bounds.height, 1);
    const containerArea = w * h;
    const PACKING_FACTOR = 0.42; // Anteil der Fläche, den Bubbles insgesamt einnehmen dürfen
    const targetTotalArea = containerArea * PACKING_FACTOR;

    const weights = ideasList.map((idea) => {
      const t = Math.pow(scoreToT(computeScore(idea)), 1.3);
      return 0.3 + 0.7 * t; // Mindestanteil, damit die kleinste Bubble nie auf 0 schrumpft
    });
    const totalWeight = weights.reduce((a, b) => a + b, 0) || 1;

    const minAllowed = 40;
    const maxAllowed = Math.max(minAllowed + 10, Math.min(w, h) * 0.85);

    ideasList.forEach((idea, i) => {
      const share = weights[i] / totalWeight;
      const area = targetTotalArea * share;
      let diameter = 2 * Math.sqrt(area / Math.PI);
      diameter = Math.max(minAllowed, Math.min(maxAllowed, diameter));
      sizeMap[idea.id] = diameter;
    });
    return sizeMap;
  }

  const bubbleSizeById = computeBubbleSizes(filtered, stageSize);

  const bubbleKey = filtered
    .map((i) => `${i.id}|${i.status}|${computeScore(i).toFixed(1)}`)
    .join(",");

  function getStageBounds() {
    if (stageRef.current) {
      const rect = stageRef.current.getBoundingClientRect();
      if (rect.width > 0 && rect.height > 0) return { width: rect.width, height: rect.height };
    }
    return stageSize;
  }

  function clamp(v, min, max) {
    return Math.min(max, Math.max(min, v));
  }

  function handleStageMouseMove(e) {
    if (!stageRef.current) return;
    const rect = stageRef.current.getBoundingClientRect();
    mouseRef.current.x = e.clientX - rect.left;
    mouseRef.current.y = e.clientY - rect.top;
    mouseRef.current.active = true;
  }

  function handleStageMouseLeave() {
    mouseRef.current.active = false;
  }

  function handlePointerMove(e) {
    const drag = dragRef.current;
    if (!drag.id || !stageRef.current) return;
    const rect = stageRef.current.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    if (Math.abs(mx - drag.startX) > 4 || Math.abs(my - drag.startY) > 4) drag.moved = true;
    const p = simRef.current[drag.id];
    if (p) {
      p.vx = mx - p.x;
      p.vy = my - p.y;
      p.x = clamp(mx, p.r, rect.width - p.r);
      p.y = clamp(my, p.r, rect.height - p.r);
    }
    mouseRef.current.x = mx;
    mouseRef.current.y = my;
    mouseRef.current.active = true;
  }

  function handlePointerUp() {
    const drag = dragRef.current;
    window.removeEventListener("pointermove", handlePointerMove);
    window.removeEventListener("pointerup", handlePointerUp);
    const p = drag.id ? simRef.current[drag.id] : null;
    if (p) {
      p.dragging = false;
      const speed = Math.hypot(p.vx, p.vy);
      const maxFling = 3.2;
      if (speed > maxFling) { p.vx = (p.vx / speed) * maxFling; p.vy = (p.vy / speed) * maxFling; }
      if (drag.moved) {
        const bounds = getStageBounds();
        const posX = bounds.width > 0 ? p.x / bounds.width : 0.5;
        const posY = bounds.height > 0 ? p.y / bounds.height : 0.5;
        updateIdeaPosition(drag.id, posX, posY);
      }
    }
    if (drag.id && !drag.moved && drag.idea) {
      openEditForm(drag.idea, true);
    }
    dragRef.current = { id: null, idea: null, startX: 0, startY: 0, moved: false };
  }

  function handleBubblePointerDown(e, idea) {
    e.preventDefault();
    if (!stageRef.current) return;
    const rect = stageRef.current.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    dragRef.current = { id: idea.id, idea, startX: mx, startY: my, moved: false };
    const p = simRef.current[idea.id];
    if (p) { p.dragging = true; p.vx = 0; p.vy = 0; }
    window.addEventListener("pointermove", handlePointerMove);
    window.addEventListener("pointerup", handlePointerUp);
  }

  // Sync simulation entries with the current filtered idea list (add/remove/resize)
  useEffect(() => {
    if (viewMode !== "bubbles") return;
    const bounds = getStageBounds();
    const currentIds = new Set(filtered.map((i) => i.id));
    Object.keys(simRef.current).forEach((id) => {
      if (!currentIds.has(id)) delete simRef.current[id];
    });
    filtered.forEach((idea) => {
      const r = (bubbleSizeById[idea.id] || 90) / 2;
      const existing = simRef.current[idea.id];
      if (existing) {
        existing.r = r;
      } else {
        let x, y;
        if (typeof idea.posX === "number" && typeof idea.posY === "number") {
          x = clamp(idea.posX * bounds.width, r, Math.max(bounds.width - r, r));
          y = clamp(idea.posY * bounds.height, r, Math.max(bounds.height - r, r));
        } else {
          x = Math.random() * Math.max(bounds.width - 2 * r, 10) + r;
          y = Math.random() * Math.max(bounds.height - 2 * r, 10) + r;
        }
        const angle = Math.random() * Math.PI * 2;
        const speed = 0.12 + Math.random() * 0.18;
        simRef.current[idea.id] = {
          id: idea.id,
          x, y, r,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
        };
        const el = nodeRefs.current[idea.id];
        if (el) el.style.transform = `translate(${x - r}px, ${y - r}px)`;
      }
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [bubbleKey, viewMode, stageSize]);

  // Stage-Größe aktuell halten (Fenster-Resize, Bildschirmdrehung, Sidebar etc.),
  // damit die Bubble-Größen immer zur tatsächlich verfügbaren Fläche passen.
  // Wichtig: hängt zusätzlich davon ab, ob die Fläche gerade wirklich im DOM existiert —
  // die entsteht erst, sobald die Ideen geladen sind (filtered.length > 0), nicht schon
  // beim ersten Rendern mit viewMode "bubbles" allein.
  useEffect(() => {
    if (goals) setGoalsDraft(goals);
  }, [goals]);

  const needsOnboarding = loaded && goals === null;

  // Solange ein Fenster (Modal/Onboarding) offen ist, wird der Hintergrund fixiert,
  // damit ausschließlich das Fenster scrollbar ist (wichtig für iOS Safari).
  const lockScroll = showForm || needsOnboarding;
  useEffect(() => {
    if (!lockScroll) return;
    const body = document.body;
    const scrollY = window.scrollY;
    const prev = {
      position: body.style.position,
      top: body.style.top,
      width: body.style.width,
      overflow: body.style.overflow,
    };
    body.style.position = "fixed";
    body.style.top = `-${scrollY}px`;
    body.style.width = "100%";
    body.style.overflow = "hidden";
    return () => {
      body.style.position = prev.position;
      body.style.top = prev.top;
      body.style.width = prev.width;
      body.style.overflow = prev.overflow;
      window.scrollTo(0, scrollY);
    };
  }, [lockScroll]);

  const hasBubbleStage = viewMode === "bubbles" && filtered.length > 0;

  useEffect(() => {
    if (!hasBubbleStage || !stageRef.current) return;
    const el = stageRef.current;
    function updateStageSize() {
      const rect = el.getBoundingClientRect();
      if (rect.width > 0 && rect.height > 0) {
        setStageSize({ width: rect.width, height: rect.height });
      }
    }
    updateStageSize();
    // Doppeltes rAF als Sicherheitsnetz, falls das Layout beim ersten Aufruf
    // (z. B. wegen Web-Fonts) noch nicht ganz fertig war.
    requestAnimationFrame(() => requestAnimationFrame(updateStageSize));
    const ro = new ResizeObserver(updateStageSize);
    ro.observe(el);
    window.addEventListener("resize", updateStageSize);
    return () => {
      ro.disconnect();
      window.removeEventListener("resize", updateStageSize);
    };
  }, [hasBubbleStage]);

  // Animation loop: gentle drifting motion with soft collisions, like a bubble tank
  useEffect(() => {
    if (viewMode !== "bubbles") return;
    function tick() {
      const bounds = getStageBounds();
      const items = Object.values(simRef.current);
      // Kollisionen zwischen Bubbles — eine gezogene Bubble hat "unendliche Masse"
      // und wird selbst nicht verschoben, stößt andere aber weg.
      for (let i = 0; i < items.length; i++) {
        for (let j = i + 1; j < items.length; j++) {
          const a = items[i], b = items[j];
          const dx = b.x - a.x, dy = b.y - a.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
          const minDist = a.r + b.r + 3;
          if (dist < minDist) {
            const overlap = minDist - dist;
            const nx = dx / dist, ny = dy / dist;
            if (a.dragging && !b.dragging) {
              b.x += nx * overlap; b.y += ny * overlap;
              b.vx += nx * 0.5; b.vy += ny * 0.5;
            } else if (b.dragging && !a.dragging) {
              a.x -= nx * overlap; a.y -= ny * overlap;
              a.vx -= nx * 0.5; a.vy -= ny * 0.5;
            } else if (!a.dragging && !b.dragging) {
              const half = overlap / 2;
              a.x -= nx * half; a.y -= ny * half;
              b.x += nx * half; b.y += ny * half;
              const relVX = b.vx - a.vx, relVY = b.vy - a.vy;
              const dot = relVX * nx + relVY * ny;
              if (dot < 0) {
                const impulse = dot * 0.5;
                a.vx += impulse * nx; a.vy += impulse * ny;
                b.vx -= impulse * nx; b.vy -= impulse * ny;
              }
            }
          }
        }
      }
      // Cursor stößt Bubbles wie eine Kollision ab, sobald die Maus in die Nähe kommt.
      if (mouseRef.current.active) {
        const cursorR = 30;
        items.forEach((p) => {
          if (p.dragging) return;
          const dx = p.x - mouseRef.current.x, dy = p.y - mouseRef.current.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
          const minDist = p.r + cursorR;
          if (dist < minDist) {
            const overlap = minDist - dist;
            const nx = dx / dist, ny = dy / dist;
            p.x += nx * overlap * 0.03;
            p.y += ny * overlap * 0.03;
            p.vx += nx * overlap * 0.001;
            p.vy += ny * overlap * 0.001;
          }
        });
      }
      items.forEach((p) => {
        if (p.dragging) {
          p.x = clamp(p.x, p.r, bounds.width - p.r);
          p.y = clamp(p.y, p.r, bounds.height - p.r);
        } else {
          p.vx += (Math.random() - 0.5) * 0.018;
          p.vy += (Math.random() - 0.5) * 0.018;
          p.vx *= 0.99;
          p.vy *= 0.99;
          const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
          const maxSpeed = 0.55;
          if (speed > maxSpeed) { p.vx = (p.vx / speed) * maxSpeed; p.vy = (p.vy / speed) * maxSpeed; }
          p.x += p.vx;
          p.y += p.vy;
          if (p.x - p.r < 0) { p.x = p.r; p.vx = Math.abs(p.vx); }
          if (p.x + p.r > bounds.width) { p.x = bounds.width - p.r; p.vx = -Math.abs(p.vx); }
          if (p.y - p.r < 0) { p.y = p.r; p.vy = Math.abs(p.vy); }
          if (p.y + p.r > bounds.height) { p.y = bounds.height - p.r; p.vy = -Math.abs(p.vy); }
        }
        const el = nodeRefs.current[p.id];
        if (el) el.style.transform = `translate(${p.x - p.r}px, ${p.y - p.r}px)`;
      });
      rafRef.current = requestAnimationFrame(tick);
    }
    rafRef.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(rafRef.current);
  }, [viewMode]);



  const counts = ideas.reduce((acc, i) => {
    acc[i.status] = (acc[i.status] || 0) + 1;
    return acc;
  }, {});

  return (
    <div className="wrap">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap');

        * { box-sizing: border-box; }
        .wrap {
          --ink: #2B2250;
          --ink-dim: #8377AC;
          --bg: #FBF3EC;
          --surface: #FFFFFF;
          --surface-2: #F3EEFB;
          --amber: #FFC94A;
          --teal: #06D6A0;
          --rust: #FF5D8F;
          --line: #ECE3FA;
          --navy: #211D33;
          --card-radius: 20px;
          --card-shadow: 0 10px 28px rgba(43,34,80,0.10);
          font-family: 'Nunito', -apple-system, sans-serif;
          background: linear-gradient(135deg, #FFF3E0 0%, #FDE7EF 32%, #EEE3FB 62%, #E3F3FF 100%);
          background-attachment: fixed;
          color: var(--ink);
          min-height: 100vh;
          padding: 40px 28px 110px;
          -webkit-font-smoothing: antialiased;
        }
        .header {
          max-width: 920px;
          margin: 0 auto 24px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 16px;
        }
        .title {
          font-family: 'Baloo 2', cursive;
          font-size: 28px;
          font-weight: 600;
          line-height: 1.1;
          margin: 0 0 6px;
          letter-spacing: -0.01em;
        }
        .subtitle {
          color: var(--ink-dim);
          font-size: 14.5px;
          margin: 0;
          max-width: 46ch;
        }
        .add-btn-round {
          width: 46px; height: 46px; flex-shrink: 0;
          background: var(--navy); color: #fff; border: none; border-radius: 50%;
          font-size: 24px; line-height: 1; cursor: pointer;
          display: flex; align-items: center; justify-content: center;
          box-shadow: 0 8px 18px rgba(33,29,51,0.3);
        }
        .add-btn-round:hover { background: #33304a; }
        .account-chip {

          )}
        </div>
        <button className="add-btn-round" onClick={openNewForm} aria-label="Neue Idee" title="Neue Idee">+</button>
      </div>

      {error && <div className="error-banner">{error}</div>}

      {loaded && ideas.length > 0 && (
        <div className="toolbar">
          <div className="chips">
            <button className={`chip ${filter.size === 0 ? "active" : ""}`} onClick={() => toggleFilter("alle")}>
              Alle ({ideas.length})
            </button>
            {Object.entries(STATUS).map(([key, s]) => (
              <button
                key={key}
                className={`chip ${filter.has(key) ? "active" : ""}`}
                onClick={() => toggleFilter(key)}
              >
                {s.label} ({counts[key] || 0})
              </button>
            ))}
          </div>
          <div className="sortrow" style={{ gap: "16px" }}>
            <div className="view-toggle">
              <button className={viewMode === "tabelle" ? "active" : ""} onClick={() => setViewMode("tabelle")}>Tabelle</button>
              <button className={viewMode === "bubbles" ? "active" : ""} onClick={() => setViewMode("bubbles")}>Bubbles</button>
            </div>
          </div>
        </div>
      )}

      {loaded && ideas.length === 0 && (
        <div className="empty">
          <div className="title2">Noch keine Ideen gesammelt</div>
          <p>Trag deine erste Geschäftsidee ein und gib ihr eine erste Einschätzung.</p>
        </div>
      )}

      {loaded && ideas.length > 0 && filtered.length === 0 && (
        <div className="empty">
          <div className="title2">Keine Ideen in diesem Status</div>
          <p>Wähle einen anderen Filter oder lege eine neue Idee an.</p>
        </div>
      )}


      {viewMode === "bubbles" && filtered.length > 0 && (
        <>
          <div className="bubble-legend">
            {Object.entries(STATUS).map(([key, s]) => (
              <span key={key}><span className="dot" style={{ background: s.color }}></span>{s.label}</span>
            ))}
          </div>
          <div
            className="bubble-stage"
            ref={stageRef}
            onMouseMove={handleStageMouseMove}
            onMouseLeave={handleStageMouseLeave}
          >
            {filtered.map((idea) => {
              const score = computeScore(idea);
              const st = STATUS[idea.status];
              const size = bubbleSizeById[idea.id] || 90;
              const fontSize = 11 + scoreToT(score) * 6.5;
              const stale = isStale(idea);
              return (
                <div
                  key={idea.id}
                  ref={(el) => { nodeRefs.current[idea.id] = el; }}
                  className={`bubble-float${stale ? " bubble-stale" : ""}`}
                  onPointerDown={(e) => handleBubblePointerDown(e, idea)}
                  style={{
                    width: size,
                    height: size,
                    color: st.text,
                    border: "none",
                    backgroundImage: `radial-gradient(circle at 32% 24%, ${shade(st.color, 0.5)} 0%, ${st.color} 55%, ${shade(st.color, -0.15)} 100%)`,
                    boxShadow: `0 14px 26px -8px ${st.color}b3, inset 0 3px 6px rgba(255,255,255,0.4), inset 0 -8px 12px rgba(0,0,0,0.15)`,
                  }}
                  title={`${idea.description || idea.title}${stale ? " — seit über einer Woche kein Meilenstein" : ""}`}
                >
                  <div className="b-title" style={{ fontSize, textShadow: st.text === "#fff" ? "0 1px 3px rgba(0,0,0,0.3)" : "0 1px 0 rgba(255,255,255,0.5)" }}>{idea.title}</div>
                  <div className="b-score" style={{ color: st.text, textShadow: st.text === "#fff" ? "0 1px 2px rgba(0,0,0,0.3)" : "0 1px 0 rgba(255,255,255,0.5)" }}>{score.toFixed(1)}</div>
                  {recentMilestoneCount(idea) > 0 && (
                    <div className="bubble-momentum" title={`${recentMilestoneCount(idea)} Meilenstein(e) in den letzten 7 Tagen`}>
                      🔥{recentMilestoneCount(idea)}
                    </div>
                  )}
                  {iceBlockCount(idea) > 0 && (
                    <div className="bubble-momentum bubble-ice" title={`${iceBlockCount(idea)} Eisblock(-blöcke) — lange keine Aktivität`}>
                      ❄️{iceBlockCount(idea)}
                    </div>
                  )}
                  <button
                    type="button"
                    className="bubble-delete"
                    onPointerDown={(e) => e.stopPropagation()}
                    onClick={(e) => { e.stopPropagation(); removeIdea(idea.id); }}
                    aria-label="Idee löschen"
                    title="Idee löschen"
                  >
                    ×
                  </button>
                </div>
              );
            })}
          </div>
        </>
      )}

      {viewMode === "tabelle" && filtered.length > 0 && (
        <div className="table-wrap">
          <table className="idea-table">
            <thead>
              <tr>
                <th onClick={() => toggleSortCol("title")}>
                  Idee {sortCol === "title" && <span className="arrow">{sortDir === "asc" ? "↑" : "↓"}</span>}
                </th>
                <th onClick={() => toggleSortCol("score")}>
                  Score {sortCol === "score" && <span className="arrow">{sortDir === "asc" ? "↑" : "↓"}</span>}
                </th>
                <th onClick={() => toggleSortCol("impact")}>
                  Potenzial {sortCol === "impact" && <span className="arrow">{sortDir === "asc" ? "↑" : "↓"}</span>}
                </th>
                <th onClick={() => toggleSortCol("effort")}>
                  Aufwand {sortCol === "effort" && <span className="arrow">{sortDir === "asc" ? "↑" : "↓"}</span>}
                </th>
                <th onClick={() => toggleSortCol("confidence")}>
                  Überzeugung {sortCol === "confidence" && <span className="arrow">{sortDir === "asc" ? "↑" : "↓"}</span>}
                </th>
                <th onClick={() => toggleSortCol("status")}>
                  Status {sortCol === "status" && <span className="arrow">{sortDir === "asc" ? "↑" : "↓"}</span>}
                </th>
                <th onClick={() => toggleSortCol("createdAt")}>
                  Angelegt {sortCol === "createdAt" && <span className="arrow">{sortDir === "asc" ? "↑" : "↓"}</span>}
                </th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              {tableSorted.map((idea) => {
                const score = computeScore(idea);
                const tier = scoreTier(score);
                const st = STATUS[idea.status];
                return (
                  <tr key={idea.id}>
                    <td className="title-cell" onClick={() => openEditForm(idea)}>
                      <div className="t">
                        <span className="status-avatar" style={{ background: `${st.color}33` }}>{st.icon}</span>
                        {idea.title}
                      </div>
                      {idea.description && <div className="d">{idea.description}</div>}
                    </td>
                    <td className="num">
                      <span className="score-pill" style={{ borderColor: tier, color: tier }}>{score.toFixed(1)}</span>
                    </td>
                    <td className="num">{idea.impact}</td>
                    <td className="num">{idea.effort}</td>
                    <td className="num">{idea.confidence}</td>
                    <td>
                      <select
                        className="status-select"
                        value={idea.status}
                        onChange={(e) => changeStatus(idea.id, e.target.value)}
                      >
                        {Object.entries(STATUS).map(([key, s]) => (
                          <option key={key} value={key}>{s.icon} {s.label}</option>
                        ))}
                      </select>
                    </td>
                    <td className="num" style={{ textAlign: "left", color: "var(--ink-dim)" }}>
                      {new Date(idea.createdAt).toLocaleDateString("de-DE")}
                    </td>
                    <td className="actions-cell">
                      <button className="link-btn" onClick={() => removeIdea(idea.id)}>Löschen</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
      </>
      )}

      {activeTab === "projekte" && (
        <>
          <div className="header">
            <div>
              <h1 className="title">Projekte</h1>
              <p className="subtitle">Ideen, die 4 Wochen durchgehend Topscorer waren, landen automatisch hier.</p>
            </div>
          </div>

          {projects.length === 0 ? (
            <div className="empty">
              <div className="title2">Noch keine Projekte</div>
              <p>Eine Idee wird automatisch zum Projekt befördert, sobald sie 4 Wochen durchgehend die beste Bewertung aller Ideen hatte.</p>
            </div>
          ) : (
            <div className="project-list">
              {[...projects].sort((a, b) => b.promotedAt - a.promotedAt).map((p) => {
                const st = STATUS[p.status] || STATUS.idee;
                return (
                  <div className="project-card" key={p.id}>
                    <div className="project-card-top">
                      <span className="status-avatar" style={{ background: `${st.color}33` }}>{st.icon}</span>
                      <div className="project-card-title" onClick={() => openProjectEdit(p)}>{p.title}</div>
                      <button className="link-btn" onClick={(e) => { e.stopPropagation(); demoteToIdea(p.id); }}>Zurück zu Ideen</button>
                      <button className="link-btn" onClick={(e) => { e.stopPropagation(); removeProject(p.id); }}>Löschen</button>
                    </div>
                    {p.description && <p className="project-card-desc">{p.description}</p>}
                    <div className="project-card-meta">
                      <span className="project-badge">🏆 Score {p.promotedScore != null ? p.promotedScore.toFixed(1) : "–"}</span>
                      <span>Projekt seit {new Date(p.promotedAt).toLocaleDateString("de-DE")}</span>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </>
      )}

      {activeTab === "ziele" && (
        <>
          <div className="header">
            <div>
              <h1 className="title">Ziele</h1>
              <p className="subtitle">Definiere, was du mit deiner Geschäftsidee erreichen möchtest — jederzeit änderbar.</p>
            </div>
          </div>

          <div className="goals-form">
            {GOAL_QUESTIONS.map((q) => (
              <div className="goals-question-block" key={q.key}>
                <div className="goals-question-label">{q.question}</div>
                <div className="goals-option-row">
                  {q.options.map((opt) => {
                    const selected = q.type === "multi"
                      ? (goalsDraft[q.key] || []).includes(opt.value)
                      : goalsDraft[q.key] === opt.value;
                    return (
                      <button
                        key={opt.value}
                        className={`goals-chip ${selected ? "goals-chip-active" : ""}`}
                        onClick={() => (q.type === "multi" ? toggleGoalMulti(q.key, opt.value) : selectGoalSingle(q.key, opt.value))}
                      >
                        {opt.label}
                      </button>
                    );
                  })}
                </div>
              </div>
            ))}
            <button className="btn-primary goals-save-btn" onClick={saveGoalsFromTab}>Ziele speichern</button>
          </div>
        </>
      )}

      {showForm && (
        <div className="modal-backdrop" onMouseDown={(e) => { if (e.target === e.currentTarget) setShowForm(false); }}>
          <div className="modal">
            <h2>{editTarget === "project" ? "Projekt bearbeiten" : (editId ? "Idee bearbeiten" : "Neue Idee")}</h2>
            <div className="field">
              <label>Titel</label>
              <input
                ref={titleRef}
                type="text"
                value={draft.title}
                onChange={(e) => setDraft({ ...draft, title: e.target.value })}
                placeholder="z. B. Abo-Service für Zimmerpflanzen"
              />
            </div>
            <div className="field">
              <label>Beschreibung</label>
              <textarea
                rows={3}
                value={draft.description}
                onChange={(e) => setDraft({ ...draft, description: e.target.value })}
                placeholder="Worum geht's, für wen, und warum jetzt?"
              />
            </div>
            <button
              type="button"
              className="eval-toggle"
              style={{ marginBottom: modalEvalExpanded ? "16px" : "8px" }}
              onClick={() => setModalEvalExpanded((v) => !v)}
            >
              <span>Bewertung</span>
              <span className="chevron">{modalEvalExpanded ? "▲" : "▼"}</span>
            </button>
            {modalEvalExpanded && (
              <>
                <div className="field">
                  <label>Potenzial ({draft.impact}/10) — wie groß wäre der Erfolg?</label>
                  <div className="slider-row">
                    <input type="range" min="1" max="10" value={draft.impact}
                      onChange={(e) => setDraft({ ...draft, impact: Number(e.target.value) })} />
                    <span className="slider-val">{draft.impact}</span>
                  </div>
                </div>
                <div className="field">
                  <label>Aufwand ({draft.effort}/10) — wie viel Arbeit steckt drin?</label>
                  <div className="slider-row">
                    <input type="range" min="1" max="10" value={draft.effort}
                      onChange={(e) => setDraft({ ...draft, effort: Number(e.target.value) })} />
                    <span className="slider-val">{draft.effort}</span>
                  </div>
                </div>
                <div className="field">
                  <label>Überzeugung ({draft.confidence}/10) — wie sicher bist du dir?</label>
                  <div className="slider-row">
                    <input type="range" min="1" max="10" value={draft.confidence}
                      onChange={(e) => setDraft({ ...draft, confidence: Number(e.target.value) })} />
                    <span className="slider-val">{draft.confidence}</span>
                  </div>
                </div>
                <div className={`momentum-indicator${iceBlockCount(draft) > 0 ? " momentum-indicator-ice" : ""}`}>
                  <span className="momentum-flame">{iceBlockCount(draft) > 0 ? "❄️" : "🔥"}</span>
                  <div>
                    {iceBlockCount(draft) > 0 ? (
                      <>
                        <div className="momentum-count">
                          {iceBlockCount(draft)} Eisblock{iceBlockCount(draft) === 1 ? "" : "e"} — seit über {Math.floor((Date.now() - lastActivityTime(draft)) / WEEK_MS)} Wochen keine Aktivität
                        </div>
                        <div className="momentum-bonus">−{icePenalty(draft).toFixed(1)} Punkte automatisch — schmilzt, sobald wieder ein Meilenstein erreicht wird</div>
                      </>
                    ) : (
                      <>
                        <div className="momentum-count">
                          {recentMilestoneCount(draft)} aktive{recentMilestoneCount(draft) === 1 ? "r" : ""} Meilenstein{recentMilestoneCount(draft) === 1 ? "" : "e"} (letzte 7 Tage)
                        </div>
                        <div className="momentum-bonus">+{momentumBonus(draft).toFixed(1)} Punkte automatisch — nicht manuell verstellbar, verblasst nach einer Woche</div>
                      </>
                    )}
                  </div>
                </div>
              </>
            )}
            <div className="field">
              <label>Meilensteine</label>
              {draft.milestones && draft.milestones.length > 0 && (
                <ul className="milestone-list">
                  {[...draft.milestones]
                    .sort((a, b) => new Date(a.date) - new Date(b.date))
                    .map((m) => (
                      <li className="milestone-item" key={m.id}>
                        <span className="milestone-date">{formatMilestoneDate(m.date)}</span>
                        <span className="milestone-text">{m.text}</span>
                        <button
                          type="button"
                          className="milestone-remove"
                          onClick={() => removeMilestone(m.id)}
                          aria-label="Meilenstein löschen"
                        >
                          ×
                        </button>
                      </li>
                    ))}
                </ul>
              )}
              <div className="milestone-add-row">
                <input
                  type="text"
                  value={milestoneText}
                  onChange={(e) => setMilestoneText(e.target.value)}
                  placeholder="Erreichter Meilenstein, z. B. Erste 10 Kunden gewonnen"
                  onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); addMilestone(); } }}
                />
                <input
                  type="date"
                  value={milestoneDate}
                  onChange={(e) => setMilestoneDate(e.target.value)}
                />
                <button type="button" className="btn-secondary" onClick={addMilestone}>
                  + Hinzufügen
                </button>
              </div>
            </div>
            <div className="field">
              <label>Status</label>
              <select
                className="status-select"
                style={{ width: "100%", padding: "10px 12px" }}
                value={draft.status}
                onChange={(e) => setDraft({ ...draft, status: e.target.value })}
              >
                {Object.entries(STATUS).map(([key, s]) => (
                  <option key={key} value={key}>{s.icon} {s.label}</option>
                ))}
              </select>
            </div>
            <div className="modal-actions">
              <div>
                {editTarget === "idea" && editId && (
                  <button className="btn-project" onClick={promoteToProjectManually} title="Diese Idee direkt als Projekt markieren">
                    🏆 Zum Projekt machen
                  </button>
                )}
                {editTarget === "project" && (
                  <button className="btn-project" onClick={demoteToIdeaFromModal} title="Dieses Projekt zurück zu den Ideen verschieben">
                    ↩️ Zurück zu Ideen
                  </button>
                )}
              </div>
              <div className="modal-actions-right">
                <button className="btn-secondary" onClick={() => setShowForm(false)}>Abbrechen</button>
                <button className="btn-primary" onClick={saveDraft} disabled={!draft.title.trim()}>
                  {editId ? "Speichern" : "Idee anlegen"}
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

      {comingSoonMsg && <div className="coming-soon-toast">{comingSoonMsg}</div>}

      <nav className="bottom-nav">
        <button
          className={`nav-item ${activeTab === "ideen" ? "nav-item-active" : ""}`}
          onClick={() => setActiveTab("ideen")}
        >
          <span className="nav-icon">💡</span>
          <span className="nav-label">Ideen</span>
        </button>
        <button
          className={`nav-item ${activeTab === "projekte" ? "nav-item-active" : ""}`}
          onClick={() => setActiveTab("projekte")}
        >
          <span className="nav-icon">🏆</span>
          <span className="nav-label">Projekte</span>
        </button>
        <button
          className={`nav-item ${activeTab === "ziele" ? "nav-item-active" : ""}`}
          onClick={() => setActiveTab("ziele")}
        >
          <span className="nav-icon">🎯</span>
          <span className="nav-label">Ziele</span>
        </button>
        <button className="nav-item" onClick={() => showComingSoon("Profil")}>
          <span className="nav-icon">👤</span>
          <span className="nav-label">Profil</span>
        </button>
      </nav>
      </>
      )}
    </div>
  );
}


window.__mountBubblesApp = (userInfo) => {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<IdeenWerkstatt userEmail={userInfo.email} onSignOut={userInfo.onSignOut} />);
};
window.__bubblesReady = true;
window.dispatchEvent(new Event('bubbles-ready'));
</script>
</body>
</html>
