<script>
  // ===== APP-VERSION — bei jedem Update erhöhen =====
  window.APP_VERSION = "1.4.7";
  // URL des KI-Proxys (Cloudflare Worker) hier eintragen, z. B. "https://startup-bubbles-ki.DEINNAME.workers.dev"
  window.AI_ENDPOINT = "";
  window.APP_BUILD = "05.10.2026";

  // ===== Nutzungsmessung — sendet NUR nach Einwilligung =====
  window.CONSENT_KEY = "sb_analytics_consent";
  window.__trackQueue = [];
  window.trackEvent = function (name, params) {
    try {
      if (typeof window.__trackImpl === "function") { window.__trackImpl(name, params || {}); return; }
      // Messung wird gerade gestartet: Ereignis kurz vormerken (nur wenn zugestimmt wurde)
      if (localStorage.getItem(window.CONSENT_KEY) === "yes") {
        window.__trackQueue.push([name, params || {}]);
        if (window.__trackQueue.length > 50) window.__trackQueue.shift();
      }
    } catch (e) {}
  };
  window.__flushTrackQueue = function () {
    var q = window.__trackQueue;
    window.__trackQueue = [];
    q.forEach(function (e) { try { if (window.__trackImpl) window.__trackImpl(e[0], e[1]); } catch (x) {} });
  };
  document.addEventListener("DOMContentLoaded", function () {
    var el = document.getElementById("login-version");
    if (el) el.textContent = "Version " + window.APP_VERSION;
  });
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, setDoc, deleteField
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBKHgOhpR0DkElyWsNxuK0vG-k9oAzLLPY",
    authDomain: "startup-bubbles.firebaseapp.com",
    projectId: "startup-bubbles",
    storageBucket: "startup-bubbles.firebasestorage.app",
    messagingSenderId: "415245240164",
    appId: "1:415245240164:web:da6aa97bbed3b6e41cdc71",
    measurementId: "G-X3G8B7DG12",
  };

  const firebaseApp = initializeApp(firebaseConfig);
  const auth = getAuth(firebaseApp);
  const db = getFirestore(firebaseApp);
  const provider = new GoogleAuthProvider();

  // ===== Nutzungsmessung: wird erst nach Einwilligung geladen =====
  let analytics = null;
  let analyticsMod = null;
  window.__initAnalytics = async function () {
    try {
      analyticsMod = analyticsMod || (await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js"));
      if (!(await analyticsMod.isSupported())) return;
      if (!analytics) analytics = analyticsMod.getAnalytics(firebaseApp);
      analyticsMod.setAnalyticsCollectionEnabled(analytics, true);
      window.__trackImpl = function (name, params) { analyticsMod.logEvent(analytics, name, params); };
      window.__flushTrackQueue();
    } catch (e) {
      console.warn("Nutzungsmessung nicht verfügbar", e);
    }
  };
  window.__disableAnalytics = function () {
    window.__trackImpl = null;
    window.__trackQueue = [];
    try { if (analyticsMod && analytics) analyticsMod.setAnalyticsCollectionEnabled(analytics, false); } catch (e) {}
    document.cookie.split(";").forEach(function (cookie) {
      var n = cookie.split("=")[0].trim();
      if (n.indexOf("_ga") === 0) document.cookie = n + "=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/";
    });
  };
  try { if (localStorage.getItem(window.CONSENT_KEY) === "yes") window.__initAnalytics(); } catch (e) {}

  let currentUser = null;
  let appMounted = false;

  function sanitizeKey(key) {
    return key.replace(/[^A-Za-z0-9_]/g, "_");
  }

  // Ersetzt die Claude-Artifact-Speicher-API durch eine Firestore-Variante,
  // gebunden an das angemeldete Google-Konto — Daten sind geräteübergreifend verfügbar.
  window.storage = {
    async get(key) {
      if (!currentUser) return null;
      try {
        const snap = await getDoc(doc(db, "appData", currentUser.uid));
        if (!snap.exists()) return null;
        const data = snap.data();
        const fieldKey = sanitizeKey(key);
        if (!(fieldKey in data)) return null;
        return { key, value: data[fieldKey], shared: false };
      } catch (e) {
        console.error("storage.get error", e);
        return null;
      }
    },
    async set(key, value) {
      if (!currentUser) return null;
      try {
        const fieldKey = sanitizeKey(key);
        await setDoc(doc(db, "appData", currentUser.uid), { [fieldKey]: value }, { merge: true });
        return { key, value, shared: false };
      } catch (e) {
        console.error("storage.set error", e);
        return null;
      }
    },
    async delete(key) {
      if (!currentUser) return null;
      try {
        const fieldKey = sanitizeKey(key);
        await setDoc(doc(db, "appData", currentUser.uid), { [fieldKey]: deleteField() }, { merge: true });
        return { key, deleted: true, shared: false };
      } catch (e) {
        console.error("storage.delete error", e);
        return null;
      }
    },
    async list(prefix) {
      if (!currentUser) return null;
      try {
        const snap = await getDoc(doc(db, "appData", currentUser.uid));
        if (!snap.exists()) return { keys: [] };
        const p = prefix ? sanitizeKey(prefix) : null;
        const keys = Object.keys(snap.data()).filter((k) => !p || k.startsWith(p));
        return { keys, prefix, shared: false };
      } catch (e) {
        console.error("storage.list error", e);
        return null;
      }
    },
  };

  function tryMount() {
    if (!currentUser || appMounted || typeof window.__mountBubblesApp !== "function") return;
    window.__mountBubblesApp({
      email: currentUser.email,
      name: currentUser.displayName,
      photo: currentUser.photoURL,
      getToken: () => currentUser.getIdToken(),
      onSignOut: () => signOut(auth),
    });
    appMounted = true;
  }

  window.addEventListener("bubbles-ready", tryMount);

  const signInBtn = document.getElementById("google-signin-btn");
  const signInBtnSecondary = document.getElementById("google-signin-btn-secondary");
  const loginGate = document.getElementById("login-gate");
  const rootEl = document.getElementById("root");
  const loginError = document.getElementById("login-error");

  async function handleSignIn() {
    loginError.textContent = "";
    signInBtn.disabled = true;
    try {
      await signInWithPopup(auth, provider);
    } catch (e) {
      loginError.textContent = "Anmeldung fehlgeschlagen. Bitte erneut versuchen.";
      console.error(e);
    } finally {
      signInBtn.disabled = false;
    }
  }

  signInBtn.addEventListener("click", handleSignIn);
  signInBtnSecondary.addEventListener("click", handleSignIn);

  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    if (user) {
      loginGate.style.display = "none";
      rootEl.style.display = "block";
      // window.__bubblesReady wird true, sobald das Babel-Skript unten fertig geladen ist
      if (window.__bubblesReady) {
        tryMount();
      }
    } else {
      loginGate.style.display = "flex";
      rootEl.style.display = "none";
      appMounted = false;
      rootEl.innerHTML = "";
    }
  });
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const STATUS = {
  idee: { label: "Idee", color: "#9B8AE0", icon: "💡", text: "#fff" },
  pruefung: { label: "In Prüfung", color: "#9B9BAE", icon: "🔍", text: "#fff" },
  validiert: { label: "Validiert", color: "#06D6A0", icon: "✅", text: "#0B3B30" },
  verworfen: { label: "Verworfen", color: "#FF5D8F", icon: "🗑️", text: "#fff" },
};

// Eigene Status für Projekte (Ideen behalten ihre eigenen oben)
const PROJECT_STATUS = {
  aktiv: { label: "Aktiv", color: "#3DDC84", icon: "🚀", text: "#0B3B22" },
  warten: { label: "Wartet", color: "#9B9BAE", icon: "⏸️", text: "#fff" },
  problem: { label: "Problem", color: "#FF9F1C", icon: "⚠️", text: "#3B2300" },
  abgeschlossen: { label: "Abgeschlossen", color: "#3A86FF", icon: "🏁", text: "#fff" },
  gescheitert: { label: "Gescheitert", color: "#FF5D8F", icon: "💥", text: "#fff" },
};
function normalizeProject(p) {
  if (!p || PROJECT_STATUS[p.status]) return p;
  return { ...p, ideaStatus: p.ideaStatus || p.status, status: "aktiv" };
}
function ideaStatusOf(p) {
  if (p && p.ideaStatus === "warten") return "pruefung";
  return p && p.ideaStatus && STATUS[p.ideaStatus] ? p.ideaStatus : "idee";
}

function hexToRgb(hex) {
  const h = hex.replace("#", "");
  const full = h.length === 3 ? h.split("").map((c) => c + c).join("") : h;
  const num = parseInt(full, 16);
  return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
}

// percent > 0 hellt Richtung Weiß auf, percent < 0 dunkelt Richtung Schwarz ab
function shade(hex, percent) {
  const { r, g, b } = hexToRgb(hex);
  const target = percent < 0 ? 0 : 255;
  const p = Math.abs(percent);
  const mix = (c) => Math.round((target - c) * p + c);
  return `rgb(${mix(r)}, ${mix(g)}, ${mix(b)})`;
}

const STORAGE_KEY = "ideenwerkstatt:ideas";
const PROJECTS_STORAGE_KEY = "ideenwerkstatt:projects";
const GOALS_STORAGE_KEY = "ideenwerkstatt:goals";

const GOAL_QUESTIONS = [
  {
    key: "ideaType",
    question: "Welche Art von Geschäftsidee soll es sein?",
    type: "single",
    options: [
      { value: "side_hustle", label: "Side Hustle (nebenbei)" },
      { value: "hauptgewerbe", label: "Hauptgewerbe (Vollzeit)" },
    ],
  },
  {
    key: "monthlyIncome",
    question: "Welchen monatlichen Verdienst strebst du an?",
    type: "single",
    options: [
      { value: "<1000", label: "Unter 1.000 €" },
      { value: "1000-5000", label: "1.000 – 5.000 €" },
      { value: "5000-20000", label: "5.000 – 20.000 €" },
      { value: ">20000", label: "Über 20.000 €" },
    ],
  },
  {
    key: "industries",
    question: "In welchem Bereich soll die Idee sein?",
    type: "multi",
    options: [
      { value: "kfz", label: "KFZ" },
      { value: "immobilien", label: "Immobilien" },
      { value: "gastro", label: "Gastro" },
      { value: "technologie", label: "Technologie / Software" },
      { value: "gesundheit", label: "Gesundheit" },
      { value: "bildung", label: "Bildung" },
      { value: "ecommerce", label: "E-Commerce" },
      { value: "sonstiges", label: "Sonstiges" },
    ],
  },
  {
    key: "timeframe",
    question: "In welchem Zeitrahmen soll die Idee stehen?",
    type: "single",
    options: [
      { value: "<6m", label: "Unter 6 Monaten" },
      { value: "6-12m", label: "6 – 12 Monate" },
      { value: ">1y", label: "Über 1 Jahr" },
    ],
  },
];

// Onboarding = Einwilligung (erste Frage) + Ziele-Fragen. Der Ziele-Tab nutzt weiter nur GOAL_QUESTIONS.
const CONSENT_STEP = {
  key: "consent",
  type: "consent",
  question: "Um die App zu verbessern, werden Nutzungsdaten aufgezeichnet — aber nie der Inhalt deiner Ideen. Bist du damit einverstanden?",
  options: [
    { value: "yes", label: "Ja, einverstanden" },
    { value: "no", label: "Nein, danke" },
  ],
  note: "Erfasst wird z. B., welche Bereiche genutzt werden. Du kannst das jederzeit im Profil ändern.",
};
const ONBOARD_STEPS = [CONSENT_STEP, ...GOAL_QUESTIONS];

function emptyGoals() {
  return { ideaType: "", monthlyIncome: "", industries: [], timeframe: "", onboarded: false };
}
const TOP_SCORER_PROJECT_MS = 28 * 24 * 60 * 60 * 1000; // 4 Wochen durchgehend Topscorer

const WEEK_MS = 7 * 24 * 60 * 60 * 1000;
const DRAG_FOLLOW = 0.1;     // Wie stark die gehaltene Bubble pro Frame zum Finger aufholt (kleiner = träger)
const DRAG_MAX_SPEED = 3.5;  // Maximale Geschwindigkeit der gehaltenen Bubble in px pro Frame
const DRAG_PUSH = 0.5; // Schubkraft einer berührten/gezogenen Bubble auf andere (1 = starr)

function lastActivityTime(idea) {
  const timestamps = (idea.milestones || [])
    .map((m) => new Date(`${m.date}T00:00:00`).getTime())
    .filter((t) => !isNaN(t));
  return timestamps.length ? Math.max(...timestamps) : idea.createdAt;
}

function recentMilestoneCount(idea) {
  const cutoff = Date.now() - WEEK_MS;
  return (idea.milestones || []).filter((m) => {
    const t = new Date(`${m.date}T00:00:00`).getTime();
    return !isNaN(t) && t >= cutoff;
  }).length;
}

function momentumBonus(idea) {
  return Math.min(recentMilestoneCount(idea) * 0.5, 2);
}

// Gegenstück zur Flamme: Sobald seit über einer Woche kein Meilenstein mehr kam
// (die Flamme also erloschen ist) und eine weitere Woche vergeht, entsteht ein
// Eisblock. Pro zusätzlicher Woche ohne Aktivität kommt ein weiterer dazu.
function iceBlockCount(idea) {
  if (idea.status === "pruefung") return 0;
  const elapsed = Date.now() - lastActivityTime(idea);
  if (elapsed <= WEEK_MS) return 0;
  const extraWeeks = Math.floor((elapsed - WEEK_MS) / WEEK_MS);
  return Math.max(0, Math.min(extraWeeks, 6));
}

function icePenalty(idea) {
  return iceBlockCount(idea) * 0.5;
}

const AI_WEIGHT = 0.2; // Anteil der KI-Analyse am Gesamt-Score

function computeScore(idea) {
  const ease = 11 - idea.effort;
  const base = (idea.impact * 2 + idea.confidence + ease) / 4;
  const adjusted = base + momentumBonus(idea) - icePenalty(idea);
  const ai = idea.analysis && typeof idea.analysis.score === "number" ? idea.analysis.score : null;
  // Ohne Analyse bleibt der Score unverändert; mit Analyse: 80 % bisheriger Score + 20 % KI-Score
  return ai == null ? adjusted : adjusted * (1 - AI_WEIGHT) + ai * AI_WEIGHT;
}

function scoreTier(score) {
  if (score >= 7.5) return "#06D6A0";
  if (score >= 5) return "#FFC93C";
  return "#FF5D8F";
}

const STALE_MS = WEEK_MS;

function isStale(idea) {
  if (idea.status === "pruefung") return false;
  return Date.now() - lastActivityTime(idea) > STALE_MS;
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

const emptyDraft = () => ({

  description: "",

const track = (name, params) => { if (window.trackEvent) window.trackEvent(name, params); };

function trackMilestoneDelta(original, finalDraft) {
  const prev = original ? (original.milestones || []).length : 0;
  const added = (finalDraft.milestones || []).length - prev;
  if (added > 0) track("meilenstein_hinzugefuegt", { anzahl: added });

// ===== KI-Analyse =====
const AI_SYSTEM = "Du bist ein erfahrener, nüchterner Startup-Analyst. Du bewertest Geschäftsideen ehrlich und realistisch, ohne zu schmeicheln. Antworte ausschließlich mit gültigem JSON, ohne Erklärtext und ohne Markdown.";

function goalLabel(key, value) {
  const q = GOAL_QUESTIONS.find((x) => x.key === key);
  const o = q && q.options.find((x) => x.value === value);
  return o ? o.label : null;
}

function goalsToText(g) {
  const none = "nicht angegeben";
  if (!g) return "- (keine Ziele hinterlegt)";
  const inds = (g.industries || []).map((v) => goalLabel("industries", v)).filter(Boolean);
  return [
    "- Art der Geschäftsidee: " + (goalLabel("ideaType", g.ideaType) || none),
    "- Angestrebter monatlicher Verdienst: " + (goalLabel("monthlyIncome", g.monthlyIncome) || none),
    "- Bevorzugte Branchen: " + (inds.length ? inds.join(", ") : none),
    "- Zeitrahmen: " + (goalLabel("timeframe", g.timeframe) || none),
  ].join("\n");
}

// Schlüssel aus allem, was die Analyse beeinflusst — ändert er sich, ist die Analyse veraltet
function analysisInputKey(idea, g) {
  return [
    idea.title, idea.description, idea.impact, idea.effort, idea.confidence,
    (idea.milestones || []).length,
    g ? JSON.stringify([g.ideaType, g.monthlyIncome, g.industries, g.timeframe]) : "",
  ].join("|");
}

function needsAnalysis(idea, g) {
  return !idea.analysis || idea.analysis.inputKey !== analysisInputKey(idea, g);
}

function buildAnalysisPrompt(idea, g) {
  const ms = (idea.milestones || [])
    .slice()
    .sort((a, b) => new Date(a.date) - new Date(b.date))
    .map((m) => "- " + m.date + ": " + m.text)
    .join("\n") || "keine";
  const st = STATUS[idea.status] ? STATUS[idea.status].label : idea.status;
  return [
    "Analysiere diese Geschäftsidee im Verhältnis zu den persönlichen Zielen.",
    "",
    "ZIELE:",
    goalsToText(g),
    "",
    "IDEE:",
    "Titel: " + idea.title,
    "Beschreibung: " + (idea.description || "(keine)"),
    "Status: " + st,
    "Eigene Einschätzung (1-10): Potenzial " + idea.impact + ", Aufwand " + idea.effort + " (hoch = schlecht), Überzeugung " + idea.confidence,
    "Bisherige Meilensteine:",
    ms,
    "",
    "Bewerte kritisch und realistisch. Nutze die ganze Skala von 0 bis 10 (5 = durchschnittlich, 8 oder mehr nur für außergewöhnlich passende Ideen). Berücksichtige die Passung zu den Zielen (Verdienst, Zeitrahmen, Branche, nebenher vs. Hauptgewerbe), Marktpotenzial, Umsetzbarkeit und Risiken. Ist die Beschreibung dünn, bewerte vorsichtig und sage, was fehlt.",
    "",
    "Antworte nur mit JSON in genau diesem Format:",
    '{"score": <Zahl 0-10 mit einer Nachkommastelle>, "summary": "<2-3 Sätze>", "goalFit": "<1-2 Sätze zur Passung zu den Zielen>", "strengths": ["<max. 3 Punkte>"], "risks": ["<max. 3 Punkte>"], "nextStep": "<ein konkreter nächster Schritt>"}',
  ].join("\n");
}

function parseAnalysis(raw) {
  const t = String(raw || "").trim();
  const a = t.indexOf("{");
  const b = t.lastIndexOf("}");
  if (a === -1 || b <= a) throw { code: "parse" };
  let obj;
  try { obj = JSON.parse(t.slice(a, b + 1)); } catch (e) { throw { code: "parse" }; }
  let score = Number(obj.score);
  if (!isFinite(score)) throw { code: "parse" };
  score = Math.round(Math.min(10, Math.max(0, score)) * 10) / 10;
  const list = (v) => (Array.isArray(v) ? v : []).map((x) => String(x).trim()).filter(Boolean).slice(0, 3);
  return {
    score,
    summary: String(obj.summary || "").trim(),
    goalFit: String(obj.goalFit || "").trim(),
    strengths: list(obj.strengths),
    risks: list(obj.risks),
    nextStep: String(obj.nextStep || "").trim(),
  };
}

// Fragt die KI: in der Claude-Vorschau direkt über Claude, in der echten App über den eigenen Proxy
async function aiAsk(system, prompt, getToken) {
  if (window.AI_MODE === "runtime") {
    const sample = window.claude ? await window.claude.use("sample") : null;
    if (!sample) throw { code: "unavailable" };
    const res = await sample(system + "\n\n" + prompt, { cache: false, modelTier: "quick" });
    return res.text;
  }
  if (!window.AI_ENDPOINT) throw { code: "not_configured" };
  const token = getToken ? await getToken() : null;
  if (!token) throw { code: "not_signed_in" };
  let res;
  try {
    res = await fetch(window.AI_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({ system, prompt }),
    });
  } catch (e) {
    throw { code: "network" };
  }
  if (!res.ok) {
    let msg = "";
    try { msg = (await res.json()).error || ""; } catch (e) { /* ignorieren */ }
    throw { code: "http_" + res.status, message: msg };
  }
  const data = await res.json();
  return data.text;
}

function aiErrorText(e) {
  const code = e && e.code;
  if (code === "not_configured") return "Die KI-Analyse ist noch nicht eingerichtet (Proxy-URL fehlt).";
  if (code === "not_granted") return "Zugriff auf die KI wurde abgelehnt.";
  if (code === "rate_limited") return "Zu viele Anfragen — bitte kurz warten und erneut versuchen.";
  if (code === "unavailable") return "Die KI ist in dieser Umgebung nicht verfügbar.";
  if (code === "not_signed_in" || code === "http_401") return "Anmeldung abgelaufen — bitte neu anmelden und erneut versuchen.";
  if (code === "http_403") return "Dein Konto ist für die KI-Analyse nicht freigeschaltet.";
  if (code === "network") return "Keine Verbindung zum KI-Dienst — bitte später erneut versuchen.";
  if (code === "parse") return "Die KI-Antwort konnte nicht gelesen werden — bitte erneut versuchen.";
  return "Analyse fehlgeschlagen" + (e && e.message ? ": " + e.message : ".");
}

  useEffect(() => {

  function demoteToIdea(id) {
    const project = projects.find((p) => p.id === id);
    if (!project) return;
    const { promotedAt, promotedScore, ideaStatus, ...rest } = project;
    const restored = { ...rest, status: ideaStatusOf(project), topScorerSince: null };
    persistProjects(projects.filter((p) => p.id !== id));
    persist([...ideas, restored]);
    track("projekt_zurueckgestuft", { quelle: "karte" });
  }

  // Prüft bei jeder Datenänderung, wer aktuell Topscorer ist, merkt sich seit wann,
  // und befördert eine Idee automatisch zum Projekt, sobald sie 4 Wochen durchgehend
  // die höchste Bewertung aller Ideen hatte.
  useEffect(() => {
    if (!loaded || ideas.length === 0) return;

    let topIdea = null;
    let topScore = -Infinity;
    ideas.forEach((idea) => {
      const s = computeScore(idea);
      if (s > topScore) {
        topScore = s;
        topIdea = idea;
      }
    });
    if (!topIdea) return;

    const now = Date.now();
    let changed = false;
    const nextIdeas = ideas.map((idea) => {
      if (idea.id === topIdea.id) {
        if (!idea.topScorerSince) {
          changed = true;
          return { ...idea, topScorerSince: now };
        }
        return idea;
      }
      if (idea.topScorerSince) {
        changed = true;
        return { ...idea, topScorerSince: null };
      }
      return idea;
    });

    const currentTop = nextIdeas.find((i) => i.id === topIdea.id);
    if (currentTop.topScorerSince && now - currentTop.topScorerSince >= TOP_SCORER_PROJECT_MS) {
      const { topScorerSince, ...rest } = currentTop;
      const promoted = { ...rest, ideaStatus: currentTop.status, status: "aktiv", promotedAt: now, promotedScore: topScore };
      const remainingIdeas = nextIdeas.filter((i) => i.id !== topIdea.id);
      persist(remainingIdeas);
      persistProjects([...projects, promoted]);
      track("projekt_befoerdert", { art: "automatisch" });
      return;
    }

    if (changed) {
      persist(nextIdeas);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [ideas, loaded]);

  function promoteToProjectManually() {
    if (!editId || editTarget !== "idea") return;
    let finalDraft = draft;
    if (milestoneText.trim()) {
      const m = { id: uid(), text: milestoneText.trim(), date: milestoneDate || new Date().toISOString().slice(0, 10) };
      finalDraft = { ...draft, milestones: [...(draft.milestones || []), m] };
    }
    const original = ideas.find((i) => i.id === editId);
    const merged = { ...finalDraft, id: editId, createdAt: original ? original.createdAt : Date.now(), analysis: original ? original.analysis : finalDraft.analysis };
    delete merged.topScorerSince;
    const score = computeScore(merged);
    const promoted = { ...merged, ideaStatus: merged.status, status: "aktiv", promotedAt: Date.now(), promotedScore: score };
    persist(ideas.filter((i) => i.id !== editId));
    persistProjects([...projects, promoted]);
    track("projekt_befoerdert", { art: "manuell" });
    setShowForm(false);
    setDraft(emptyDraft());
    setEditId(null);
    setEditTarget("idea");
    setMilestoneText("");
  }

  function removeIdea(id) {
    persist(ideas.filter((i) => i.id !== id));
    track("idee_geloescht", { quelle: "liste" });
  }

  function changeStatus(id, status) {
    persist(ideas.map((i) => (i.id === id ? { ...i, status } : i)));
    track("status_geaendert", { status });
  }

  function updateIdeaPosition(id, posX, posY) {
    persist(ideas.map((i) => (i.id === id ? { ...i, posX, posY } : i)));
  }

  function toggleFilter(key) {
    setFilter((prev) => {
      if (key === "alle") return new Set();
      const next = new Set(prev);
      if (next.has(key)) next.delete(key);
      else next.add(key);
      return next;
    });
  }

  function showToast(message) {
    setComingSoonMsg(message);
    clearTimeout(comingSoonTimeoutRef.current);
    comingSoonTimeoutRef.current = setTimeout(() => setComingSoonMsg(""), 2200);
  }

  function showComingSoon(label) {
    setComingSoonMsg(`${label} kommt bald 👀`);
    clearTimeout(comingSoonTimeoutRef.current);
    comingSoonTimeoutRef.current = setTimeout(() => setComingSoonMsg(""), 2000);
  }

  const filtered = ideas.filter((i) => filter.size === 0 || filter.has(i.status));
  function tableSortValue(idea, col) {
    if (col === "score") return computeScore(idea);
    if (col === "title") return idea.title.toLowerCase();
    if (col === "status") return STATUS[idea.status].label;
    if (col === "createdAt") return idea.createdAt;
    return idea[col];
  }

  function toggleSortCol(col) {
    if (sortCol === col) {
      setSortDir(sortDir === "asc" ? "desc" : "asc");
    } else {
      setSortCol(col);
      setSortDir(col === "title" || col === "status" ? "asc" : "desc");
    }
  }

  const tableSorted = [...filtered].sort((a, b) => {
    const va = tableSortValue(a, sortCol);
    const vb = tableSortValue(b, sortCol);
    let cmp;
    if (typeof va === "string") cmp = va.localeCompare(vb);
    else cmp = va - vb;
    return sortDir === "asc" ? cmp : -cmp;
  });

  // Größe relativ zur aktuellen Score-Spanne berechnen, nicht am starren 0–10-Raster,
  // damit Unterschiede zwischen den Ideen (v. a. Rang 1 vs. 2 vs. 3 ...) deutlich sichtbar sind.
  // Verworfene Ideen zählen nicht zur Spanne, damit sie die Skala der übrigen nicht verzerren.
  const filteredScores = filtered.filter((i) => i.status !== "verworfen").map((i) => computeScore(i));
  const scoreMax = filteredScores.length ? Math.max(...filteredScores) : 10;
  const scoreMin = filteredScores.length ? Math.min(...filteredScores) : 0;
  const DISCARDED_SIZE = 30; // verworfene Ideen: winzig, aber noch antippbar
  const scoreSpan = scoreMax - scoreMin;

  function scoreToT(score) {
    if (scoreSpan < 0.05) return 0.55; // alle Ideen etwa gleich stark bewertet
    return Math.max(0, Math.min(1, (score - scoreMin) / scoreSpan));
  }

  // Flächenbasierter Größenalgorithmus: verteilt einen festen Anteil der verfügbaren
  // Stage-Fläche auf alle Bubbles, sodass sie bei jeder Fenstergröße und Anzahl
  // rechnerisch hineinpassen, statt mit festen Pixelwerten zu überlappen.
  function computeBubbleSizes(ideasList, bounds) {
    const sizeMap = {};
    const n = ideasList.length;
    if (n === 0) return sizeMap;

    const w = Math.max(bounds.width, 1);
    const h = Math.max(bounds.height, 1);
    const containerArea = w * h;
    const PACKING_FACTOR = 0.42; // Anteil der Fläche, den Bubbles insgesamt einnehmen dürfen
    const targetTotalArea = containerArea * PACKING_FACTOR;

    const weights = ideasList.map((idea) => {
      if (idea.status === "verworfen") return 0.04; // ganz klein
      const t = Math.pow(scoreToT(computeScore(idea)), 1.8); // steile Kurve: Beste deutlich größer
      const w0 = 0.22 + 1.3 * t;
      // Die beste Idee bekommt einen Extra-Faktor, damit sie immer sofort auffällt
      return scoreSpan >= 0.05 && t >= 0.999 ? w0 * 1.8 : w0;
    });
    const totalWeight = weights.reduce((a, b) => a + b, 0) || 1;

    const minAllowed = 40;
    const maxAllowed = Math.max(minAllowed + 10, Math.min(w, h) * 0.85);

    ideasList.forEach((idea, i) => {
      const share = weights[i] / totalWeight;
      const area = targetTotalArea * share;
      let diameter = 2 * Math.sqrt(area / Math.PI);
      diameter = idea.status === "verworfen"
        ? Math.max(DISCARDED_SIZE, Math.min(minAllowed - 8, diameter))
        : Math.max(minAllowed, Math.min(maxAllowed, diameter));
      sizeMap[idea.id] = diameter;
    });
    return sizeMap;
  }

  const bubbleSizeById = computeBubbleSizes(filtered, stageSize);

  const bubbleKey = filtered
    .map((i) => `${i.id}|${i.status}|${computeScore(i).toFixed(1)}`)
    .join(",");

  function getStageBounds() {
    if (stageRef.current) {
      const rect = stageRef.current.getBoundingClientRect();
      if (rect.width > 0 && rect.height > 0) return { width: rect.width, height: rect.height };
    }
    return stageSize;
  }

  function clamp(v, min, max) {
    return Math.min(max, Math.max(min, v));
  }

  function handleStageMouseMove(e) {
    if (e.pointerType && e.pointerType !== "mouse") {
      mouseRef.current.active = false;
      return;
    }
    if (!stageRef.current) return;
    const rect = stageRef.current.getBoundingClientRect();
    mouseRef.current.x = e.clientX - rect.left;
    mouseRef.current.y = e.clientY - rect.top;
    mouseRef.current.active = true;
  }

  function handleStageMouseLeave() {
    mouseRef.current.active = false;
  }

  function handlePointerMove(e) {
    const drag = dragRef.current;
    if (!drag.id || !stageRef.current) return;
    const rect = stageRef.current.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    if (Math.abs(mx - drag.startX) > 4 || Math.abs(my - drag.startY) > 4) drag.moved = true;
    const p = simRef.current[drag.id];
    if (p) {
      p.tx = clamp(mx, p.r, rect.width - p.r);
      p.ty = clamp(my, p.r, rect.height - p.r);
    }
    if (e.pointerType === "mouse") {
      mouseRef.current.x = mx;
      mouseRef.current.y = my;
      mouseRef.current.active = true;
    }
  }

  function handlePointerUp(e) {
    if (e && e.pointerType && e.pointerType !== "mouse") mouseRef.current.active = false;
    const drag = dragRef.current;
    window.removeEventListener("pointermove", handlePointerMove);
    window.removeEventListener("pointerup", handlePointerUp);
    const p = drag.id ? simRef.current[drag.id] : null;
    if (p) {
      p.dragging = false;
      const speed = Math.hypot(p.vx, p.vy);
      const maxFling = 3.2;
      if (speed > maxFling) { p.vx = (p.vx / speed) * maxFling; p.vy = (p.vy / speed) * maxFling; }
      if (drag.moved) {
        const bounds = getStageBounds();
        const posX = bounds.width > 0 ? p.x / bounds.width : 0.5;
        const posY = bounds.height > 0 ? p.y / bounds.height : 0.5;
        updateIdeaPosition(drag.id, posX, posY);
      }
    }
    if (drag.id && !drag.moved && drag.idea) {
      openEditForm(drag.idea, true);
    }
    dragRef.current = { id: null, idea: null, startX: 0, startY: 0, moved: false };
  }

  function handleBubblePointerDown(e, idea) {
    e.preventDefault();
    if (!stageRef.current) return;
    const rect = stageRef.current.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    dragRef.current = { id: idea.id, idea, startX: mx, startY: my, moved: false };
    const p = simRef.current[idea.id];
    if (p) { p.dragging = true; p.vx = 0; p.vy = 0; p.tx = p.x; p.ty = p.y; }
    window.addEventListener("pointermove", handlePointerMove);
    window.addEventListener("pointerup", handlePointerUp);
  }

  // Sync simulation entries with the current filtered idea list (add/remove/resize)
  useEffect(() => {
    if (viewMode !== "bubbles") return;
    const bounds = getStageBounds();
    const currentIds = new Set(filtered.map((i) => i.id));
    Object.keys(simRef.current).forEach((id) => {
      if (!currentIds.has(id)) delete simRef.current[id];
    });
    filtered.forEach((idea) => {
      const r = (bubbleSizeById[idea.id] || 90) / 2;
      const existing = simRef.current[idea.id];
      if (existing) {
        existing.r = r;
      } else {
        let x, y;
        if (typeof idea.posX === "number" && typeof idea.posY === "number") {
          x = clamp(idea.posX * bounds.width, r, Math.max(bounds.width - r, r));
          y = clamp(idea.posY * bounds.height, r, Math.max(bounds.height - r, r));
        } else {
          x = Math.random() * Math.max(bounds.width - 2 * r, 10) + r;
          y = Math.random() * Math.max(bounds.height - 2 * r, 10) + r;
        }
        const angle = Math.random() * Math.PI * 2;
        const speed = 0.12 + Math.random() * 0.18;
        simRef.current[idea.id] = {
          id: idea.id,
          x, y, r,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
        };
        const el = nodeRefs.current[idea.id];
        if (el) el.style.transform = `translate(${x - r}px, ${y - r}px)`;
      }
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [bubbleKey, viewMode, stageSize]);

  // Stage-Größe aktuell halten (Fenster-Resize, Bildschirmdrehung, Sidebar etc.),
  // damit die Bubble-Größen immer zur tatsächlich verfügbaren Fläche passen.
  // Wichtig: hängt zusätzlich davon ab, ob die Fläche gerade wirklich im DOM existiert —
  // die entsteht erst, sobald die Ideen geladen sind (filtered.length > 0), nicht schon
  // beim ersten Rendern mit viewMode "bubbles" allein.
  useEffect(() => {
    if (goals) setGoalsDraft(goals);
  }, [goals]);

  const needsOnboarding = loaded && goals === null;
  // Der Dialog erscheint nur noch für Nutzer, die das Onboarding schon hinter sich haben
  const consentOpen = loaded && consent === null && !needsOnboarding;

  const onboardSteps = consentInOnboarding ? ONBOARD_STEPS : GOAL_QUESTIONS;
  const onboardQ = onboardSteps[Math.min(onboardStep, onboardSteps.length - 1)];
  const onboardSelected = (opt) =>
    onboardQ.type === "consent"
      ? consentDraft === opt.value
      : onboardQ.type === "multi"
        ? (goalsDraft[onboardQ.key] || []).includes(opt.value)
        : goalsDraft[onboardQ.key] === opt.value;
  const onboardPick = (opt) => {
    if (onboardQ.type === "consent") setConsentDraft(opt.value);
    else if (onboardQ.type === "multi") toggleGoalMulti(onboardQ.key, opt.value);
    else selectGoalSingle(onboardQ.key, opt.value);
  };

  const appOpenedRef = useRef(false);
  useEffect(() => {
    if (loaded && consent === "yes" && !appOpenedRef.current) {
      appOpenedRef.current = true;
      track("app_geoeffnet", { anzahl_ideen: ideas.length, anzahl_projekte: projects.length });
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loaded, consent]);

  useEffect(() => {
    if (loaded && consent === "yes" && !needsOnboarding) track("tab_geoeffnet", { tab: activeTab });
  }, [activeTab, loaded, consent, needsOnboarding]);

  const onboardStartedRef = useRef(false);
  useEffect(() => {
    if (needsOnboarding && consent === "yes" && !onboardStartedRef.current) {
      onboardStartedRef.current = true;
      track("onboarding_gestartet");
    }
  }, [needsOnboarding, consent]);

  // Solange ein Fenster (Modal/Onboarding) offen ist, wird der Hintergrund fixiert,
  // damit ausschließlich das Fenster scrollbar ist (wichtig für iOS Safari).
  const lockScroll = showForm || needsOnboarding || consentOpen;
  useEffect(() => {
    if (!lockScroll) return;
    const body = document.body;
    const scrollY = window.scrollY;
    const prev = {
      position: body.style.position,
      top: body.style.top,
      width: body.style.width,
      overflow: body.style.overflow,
    };
    body.style.position = "fixed";
    body.style.top = `-${scrollY}px`;
    body.style.width = "100%";
    body.style.overflow = "hidden";
    return () => {
      body.style.position = prev.position;
      body.style.top = prev.top;
      body.style.width = prev.width;
      body.style.overflow = prev.overflow;
      window.scrollTo(0, scrollY);
    };
  }, [lockScroll]);

  const hasBubbleStage = viewMode === "bubbles" && filtered.length > 0;

  useEffect(() => {
    if (!hasBubbleStage || !stageRef.current) return;
    const el = stageRef.current;
    function updateStageSize() {
      const rect = el.getBoundingClientRect();
      if (rect.width > 0 && rect.height > 0) {
        setStageSize({ width: rect.width, height: rect.height });
      }
    }
    updateStageSize();
    // Doppeltes rAF als Sicherheitsnetz, falls das Layout beim ersten Aufruf
    // (z. B. wegen Web-Fonts) noch nicht ganz fertig war.
    requestAnimationFrame(() => requestAnimationFrame(updateStageSize));
    const ro = new ResizeObserver(updateStageSize);
    ro.observe(el);
    window.addEventListener("resize", updateStageSize);
    return () => {
      ro.disconnect();
      window.removeEventListener("resize", updateStageSize);
    };
  }, [hasBubbleStage]);

  // Animation loop: gentle drifting motion with soft collisions, like a bubble tank
  useEffect(() => {
    if (viewMode !== "bubbles") return;
    function tick() {
      const bounds = getStageBounds();
      const items = Object.values(simRef.current);
      // Kollisionen zwischen Bubbles — eine gezogene Bubble hat "unendliche Masse"
      // und wird selbst nicht verschoben, stößt andere aber weg.
      for (let i = 0; i < items.length; i++) {
        for (let j = i + 1; j < items.length; j++) {
          const a = items[i], b = items[j];
          const dx = b.x - a.x, dy = b.y - a.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
          const minDist = a.r + b.r + 3;
          if (dist < minDist) {
            const overlap = minDist - dist;
            const nx = dx / dist, ny = dy / dist;
            if (a.dragging && !b.dragging) {
              b.x += nx * overlap * DRAG_PUSH; b.y += ny * overlap * DRAG_PUSH;
              b.vx += nx * 0.5 * DRAG_PUSH; b.vy += ny * 0.5 * DRAG_PUSH;
            } else if (b.dragging && !a.dragging) {
              a.x -= nx * overlap * DRAG_PUSH; a.y -= ny * overlap * DRAG_PUSH;
              a.vx -= nx * 0.5 * DRAG_PUSH; a.vy -= ny * 0.5 * DRAG_PUSH;
            } else if (!a.dragging && !b.dragging) {
              const half = overlap / 2;
              a.x -= nx * half; a.y -= ny * half;
              b.x += nx * half; b.y += ny * half;
              const relVX = b.vx - a.vx, relVY = b.vy - a.vy;
              const dot = relVX * nx + relVY * ny;
              if (dot < 0) {
                const impulse = dot * 0.5;
                a.vx += impulse * nx; a.vy += impulse * ny;
                b.vx -= impulse * nx; b.vy -= impulse * ny;
              }
            }
          }
        }
      }
      // Cursor stößt Bubbles wie eine Kollision ab, sobald die Maus in die Nähe kommt.
      if (mouseRef.current.active) {
        const cursorR = 30;
        items.forEach((p) => {
          if (p.dragging) return;
          const dx = p.x - mouseRef.current.x, dy = p.y - mouseRef.current.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
          const minDist = p.r + cursorR;
          if (dist < minDist) {
            const overlap = minDist - dist;
            const nx = dx / dist, ny = dy / dist;
            p.x += nx * overlap * 0.015;
            p.y += ny * overlap * 0.015;
            p.vx += nx * overlap * 0.0005;
            p.vy += ny * overlap * 0.0005;
          }
        });
      }
      items.forEach((p) => {
        if (p.dragging) {
          const tx = p.tx != null ? p.tx : p.x;
          const ty = p.ty != null ? p.ty : p.y;
          let mdx = (tx - p.x) * DRAG_FOLLOW;
          let mdy = (ty - p.y) * DRAG_FOLLOW;
          const msp = Math.hypot(mdx, mdy);
          if (msp > DRAG_MAX_SPEED) { mdx = (mdx / msp) * DRAG_MAX_SPEED; mdy = (mdy / msp) * DRAG_MAX_SPEED; }
          p.x += mdx;
          p.y += mdy;
          p.vx = mdx;
          p.vy = mdy;
          p.x = clamp(p.x, p.r, bounds.width - p.r);
          p.y = clamp(p.y, p.r, bounds.height - p.r);
        } else {
          p.vx += (Math.random() - 0.5) * 0.018;
          p.vy += (Math.random() - 0.5) * 0.018;
          p.vx *= 0.99;
          p.vy *= 0.99;
          const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
          const maxSpeed = 0.55;
          if (speed > maxSpeed) { p.vx = (p.vx / speed) * maxSpeed; p.vy = (p.vy / speed) * maxSpeed; }
          p.x += p.vx;
          p.y += p.vy;
          if (p.x - p.r < 0) { p.x = p.r; p.vx = Math.abs(p.vx); }
          if (p.x + p.r > bounds.width) { p.x = bounds.width - p.r; p.vx = -Math.abs(p.vx); }
          if (p.y - p.r < 0) { p.y = p.r; p.vy = Math.abs(p.vy); }
          if (p.y + p.r > bounds.height) { p.y = bounds.height - p.r; p.vy = -Math.abs(p.vy); }
        }
        const el = nodeRefs.current[p.id];
        if (el) el.style.transform = `translate(${p.x - p.r}px, ${p.y - p.r}px)`;
      });
      rafRef.current = requestAnimationFrame(tick);
    }
    rafRef.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(rafRef.current);
  }, [viewMode]);



  const counts = ideas.reduce((acc, i) => {
    acc[i.status] = (acc[i.status] || 0) + 1;
    return acc;
  }, {});

  return (
    <div className="wrap">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap');

          --navy: #211D33;

          --card-shadow: 0 10px 28px rgba(43,34,80,0.10);

          background-attachment: fixed;
          color: var(--ink);
          min-height: 100vh;
          padding: 40px 28px 110px;
          -webkit-font-smoothing: antialiased;
        }
        .header {
          max-width: 920px;
          margin: 0 auto 24px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 16px;
        }
        .title {
          font-family: 'Baloo 2', cursive;
          font-size: 28px;
          font-weight: 600;
          line-height: 1.1;
          margin: 0 0 6px;
          letter-spacing: -0.01em;
        }
        .subtitle {
          color: var(--ink-dim);
          font-size: 14.5px;
          margin: 0;
          max-width: 46ch;
        }
        .add-btn-round {
          width: 46px; height: 46px; flex-shrink: 0;
          background: var(--navy); color: #fff; border: none; border-radius: 50%;
          font-size: 24px; line-height: 1; cursor: pointer;
          display: flex; align-items: center; justify-content: center;
          box-shadow: 0 8px 18px rgba(33,29,51,0.3);
        }

        .account-chip {
          display: inline-flex; align-items: center; gap: 6px;
          background: none; border: none; box-shadow: none;

              </div>
              <div className="profile-info-row">
                <span>🏆 Projekte</span><b>{projects.length}</b>
              </div>
            </div>

            <div className="profile-card profile-info">
              <div className="profile-info-row">
                <span>App-Version</span><b>{window.APP_VERSION || "–"}</b>
              </div>
              <div className="profile-info-row">
                <span>Stand</span><b>{window.APP_BUILD || "–"}</b>
              </div>
              {window.APP_VARIANT && (
                <div className="profile-info-row">
                  <span>Variante</span><b>{window.APP_VARIANT}</b>
                </div>
              )}
            </div>

            <div className="profile-card profile-info">
              <div className="profile-info-row">
                <span>📊 Nutzungsdaten teilen</span>
                <button
                  className={`switch ${consent === "yes" ? "switch-on" : ""}`}
                  onClick={() => setConsentChoice(consent === "yes" ? "no" : "yes")}
                  role="switch"
                  aria-checked={consent === "yes"}
                  aria-label="Nutzungsdaten teilen"
                >
                  <span className="switch-knob"></span>
                </button>
              </div>
              <div className="profile-hint">Um die App zu verbessern, wird erfasst, welche Bereiche genutzt werden — nie der Inhalt deiner Ideen.</div>
            </div>

            {window.APP_VARIANT && (
              <div className="profile-card profile-info">
                <div className="profile-info-row">
                  <span>🧪 Test: erfasste Ereignisse</span><b>{(window.__trackLog || []).length}</b>
                </div>
                {consent !== "yes" && <div className="profile-hint">Messung ist aus — mit Zustimmung erscheinen hier die Ereignisse.</div>}
                {(window.__trackLog || []).slice(-10).reverse().map((e, i) => (
                  <div className="track-row" key={i}>
                    <span>{e.name}</span>
                    <code>{e.params && Object.keys(e.params).length ? JSON.stringify(e.params) : ""}</code>
                  </div>
                ))}
              </div>
            )}

            {onSignOut && (
              <button className="btn-secondary profile-signout" onClick={onSignOut}>Abmelden</button>
            )}
          </div>
        </>
      )}

      {showForm && (
        <div className="modal-backdrop" onMouseDown={(e) => { if (e.target === e.currentTarget) setShowForm(false); }}>
          <div className="modal">
            <h2>{editTarget === "project" ? "Projekt bearbeiten" : (editId ? "Idee bearbeiten" : "Neue Idee")}</h2>
            <div className="field">
              <label>Titel</label>
              <input
                ref={titleRef}
                type="text"
                value={draft.title}
                onChange={(e) => setDraft({ ...draft, title: e.target.value })}
                placeholder="z. B. Abo-Service für Zimmerpflanzen"
              />
            </div>
            <div className="field">
              <label>Beschreibung</label>
              <textarea
                rows={3}
                value={draft.description}
                onChange={(e) => setDraft({ ...draft, description: e.target.value })}
                placeholder="Worum geht's, für wen, und warum jetzt?"
              />
            </div>
            <button
              type="button"
              className="eval-toggle"
              style={{ marginBottom: modalEvalExpanded ? "16px" : "8px" }}
              onClick={() => setModalEvalExpanded((v) => !v)}
            >
              <span>Bewertung</span>
              <span className="chevron">{modalEvalExpanded ? "▲" : "▼"}</span>
            </button>
            {modalEvalExpanded && (
              <>
                <div className="field">
                  <label>Potenzial ({draft.impact}/10) — wie groß wäre der Erfolg?</label>
                  <div className="slider-row">
                    <input type="range" min="1" max="10" value={draft.impact}
                      onChange={(e) => setDraft({ ...draft, impact: Number(e.target.value) })} />
                    <span className="slider-val">{draft.impact}</span>
                  </div>
                </div>
                <div className="field">
                  <label>Aufwand ({draft.effort}/10) — wie viel Arbeit steckt drin?</label>
                  <div className="slider-row">
                    <input type="range" min="1" max="10" value={draft.effort}
                      onChange={(e) => setDraft({ ...draft, effort: Number(e.target.value) })} />
                    <span className="slider-val">{draft.effort}</span>
                  </div>
                </div>
                <div className="field">
                  <label>Überzeugung ({draft.confidence}/10) — wie sicher bist du dir?</label>
                  <div className="slider-row">
                    <input type="range" min="1" max="10" value={draft.confidence}
                      onChange={(e) => setDraft({ ...draft, confidence: Number(e.target.value) })} />
                    <span className="slider-val">{draft.confidence}</span>
                  </div>
                </div>
                {draft.analysis && typeof draft.analysis.score === "number" && (
                  <div className="momentum-indicator">
                    <span className="momentum-flame">🤖</span>
                    <div>
                      <div className="momentum-count">KI-Analyse: {draft.analysis.score.toFixed(1)} / 10</div>
                      <div className="momentum-bonus">Fließt mit 20 % in den Score ein — nicht manuell verstellbar. Details im Tab "Analyse".</div>
                    </div>
                  </div>
                )}
                <div className={`momentum-indicator${iceBlockCount(draft) > 0 ? " momentum-indicator-ice" : ""}`}>
                  <span className="momentum-flame">{iceBlockCount(draft) > 0 ? "❄️" : "🔥"}</span>
                  <div>
                    {iceBlockCount(draft) > 0 ? (
                      <>
                        <div className="momentum-count">
                          {iceBlockCount(draft)} Eisblock{iceBlockCount(draft) === 1 ? "" : "e"} — seit über {Math.floor((Date.now() - lastActivityTime(draft)) / WEEK_MS)} Wochen keine Aktivität
                        </div>
                        <div className="momentum-bonus">−{icePenalty(draft).toFixed(1)} Punkte automatisch — schmilzt, sobald wieder ein Meilenstein erreicht wird</div>
                      </>
                    ) : (
                      <>
                        <div className="momentum-count">
                          {recentMilestoneCount(draft)} aktive{recentMilestoneCount(draft) === 1 ? "r" : ""} Meilenstein{recentMilestoneCount(draft) === 1 ? "" : "e"} (letzte 7 Tage)
                        </div>
                        <div className="momentum-bonus">+{momentumBonus(draft).toFixed(1)} Punkte automatisch — nicht manuell verstellbar, verblasst nach einer Woche</div>
                      </>
                    )}
                  </div>
                </div>
              </>
            )}
            <div className="field">
              <label>Meilensteine</label>
              {draft.milestones && draft.milestones.length > 0 && (
                <ul className="milestone-list">
                  {[...draft.milestones]
                    .sort((a, b) => new Date(a.date) - new Date(b.date))
                    .map((m) => (
                      <li className="milestone-item" key={m.id}>
                        <span className="milestone-date">{formatMilestoneDate(m.date)}</span>
                        <span className="milestone-text">{m.text}</span>
                        <button
                          type="button"
                          className="milestone-remove"
                          onClick={() => removeMilestone(m.id)}
                          aria-label="Meilenstein löschen"
                        >
                          ×
                        </button>
                      </li>
                    ))}
                </ul>
              )}
              <div className="milestone-add-row">
                <input
                  type="text"
                  value={milestoneText}
                  onChange={(e) => setMilestoneText(e.target.value)}
                  placeholder="Erreichter Meilenstein, z. B. Erste 10 Kunden gewonnen"
                  onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); addMilestone(); } }}
                />
                <input
                  type="date"
                  value={milestoneDate}
                  onChange={(e) => setMilestoneDate(e.target.value)}
                />
                <button type="button" className="btn-secondary" onClick={addMilestone}>
                  + Hinzufügen
                </button>
              </div>
            </div>
            <div className="field">
              <label>Status</label>
              <select
                className="status-select"
                style={{ width: "100%", padding: "10px 12px" }}
                value={draft.status}
                onChange={(e) => setDraft({ ...draft, status: e.target.value })}
              >
                {Object.entries(editTarget === "project" ? PROJECT_STATUS : STATUS).map(([key, s]) => (
                  <option key={key} value={key}>{s.icon} {s.label}</option>
                ))}
              </select>
            </div>
            <div className="modal-actions">
              <button className="btn-secondary" onClick={() => setShowForm(false)}>Abbrechen</button>
              <button className="btn-primary" onClick={saveDraft} disabled={!draft.title.trim()}>
                {editId ? "Speichern" : "Idee anlegen"}
              </button>
              {editTarget === "idea" && editId && (
                <button className="btn-project" onClick={promoteToProjectManually} title="Diese Idee direkt als Projekt markieren">
                  🏆 Zum Projekt machen
                </button>
              )}
              {editTarget === "project" && (
                <button className="btn-project" onClick={demoteToIdeaFromModal} title="Dieses Projekt zurück zu den Ideen verschieben">
                  ↩️ Zurück zu Ideen
                </button>
              )}
              {editId && (
                <button
                  className={`btn-danger ${confirmDelete ? "btn-danger-confirm" : ""}`}
                  onClick={deleteFromModal}
                  title={editTarget === "project" ? "Dieses Projekt löschen" : "Diese Idee löschen"}
                >
                  {confirmDelete ? "Wirklich löschen?" : "🗑️ Löschen"}
                </button>
              )}
            </div>
          </div>
        </div>
      )}

      {comingSoonMsg && <div className="coming-soon-toast">{comingSoonMsg}</div>}

      <nav className="bottom-nav">
        <button
          className={`nav-item ${activeTab === "ideen" ? "nav-item-active" : ""}`}
          onClick={() => setActiveTab("ideen")}
        >
          <span className="nav-icon">💡</span>
          <span className="nav-label">Ideen</span>
        </button>
        <button
          className={`nav-item ${activeTab === "projekte" ? "nav-item-active" : ""}`}
          onClick={() => setActiveTab("projekte")}
        >
          <span className="nav-icon">🏆</span>
          <span className="nav-label">Projekte</span>
        </button>
        <button
          className={`nav-item ${activeTab === "analyse" ? "nav-item-active" : ""}`}
          onClick={() => setActiveTab("analyse")}
        >
          <span className="nav-icon">🤖</span>
          <span className="nav-label">Analyse</span>
        </button>
        <button
          className={`nav-item ${activeTab === "ziele" ? "nav-item-active" : ""}`}
          onClick={() => setActiveTab("ziele")}
        >
          <span className="nav-icon">🎯</span>
          <span className="nav-label">Ziele</span>
        </button>
        <button
          className={`nav-item ${activeTab === "profil" ? "nav-item-active" : ""}`}
          onClick={() => setActiveTab("profil")}
        >
          <span className="nav-icon">👤</span>
          <span className="nav-label">Profil</span>
        </button>
      </nav>
      </>
      )}
    </div>
  );
}


window.__mountBubblesApp = (userInfo) => {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<IdeenWerkstatt userEmail={userInfo.email} userName={userInfo.name} userPhoto={userInfo.photo} onSignOut={userInfo.onSignOut} getToken={userInfo.getToken} />);
};
window.__bubblesReady = true;
window.dispatchEvent(new Event('bubbles-ready'));
</script>
</body>
</html>
